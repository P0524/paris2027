<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊行程總管 - 多國多行程同步 Web App</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paris: {
                            navy: '#0f172a',
                            blue: '#1e3a8a',
                            amber: '#d97706',
                            accent: '#2563eb'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #172554 100%);
        }
        .toast-notify {
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 pointer-events-none toast-notify bg-slate-900/95 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-2xl border border-slate-700 flex items-center space-x-2">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">已成功同步！</span>
    </div>

    <header class="glass-header text-white sticky top-0 z-40 shadow-lg border-b border-white/10">
        <div class="max-w-4xl mx-auto px-4 pt-4 pb-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center space-x-2">
                    <span id="trip-country-tag" class="bg-amber-500 text-slate-950 font-black text-[11px] px-2 py-0.5 rounded tracking-wider shadow-sm">FR</span>
                    <!-- Trip Switcher Dropdown -->
                    <div class="relative inline-block text-left">
                        <select id="trip-selector" onchange="switchTrip(this.value)" class="bg-slate-800/90 hover:bg-slate-800 text-white font-extrabold text-base sm:text-lg border border-white/20 rounded-xl px-3 py-1 pr-8 focus:outline-none focus:ring-2 focus:ring-amber-400 appearance-none cursor-pointer">
                            <!-- Populated dynamically -->
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-amber-300 pointer-events-none"></i>
                    </div>
                    <button onclick="openNewTripModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-2.5 py-1.5 rounded-lg shadow flex items-center space-x-1 transition-all">
                        <i class="fa-solid fa-plus"></i>
                        <span class="hidden sm:inline">新增/複製行程</span>
                    </button>
                    <!-- 往上一步 (復原) 按鈕 -->
                    <button id="undo-btn" onclick="undoLastAction()" disabled class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold text-xs px-2.5 py-1.5 rounded-lg shadow flex items-center space-x-1.5 border border-slate-700 transition-all opacity-50 cursor-not-allowed" title="復原上一步驟 (Ctrl+Z)">
                        <i class="fa-solid fa-rotate-left text-amber-400"></i>
                        <span>復原<span id="undo-count" class="hidden sm:inline text-[10px] text-amber-300 ml-0.5"></span></span>
                    </button>
                </div>

                <!-- Sync Status Badge -->
                <div id="sync-status" class="bg-slate-800/80 border border-slate-700 text-slate-300 text-xs px-3 py-1 rounded-full flex items-center space-x-1.5">
                    <span id="sync-dot" class="w-2 h-2 rounded-full bg-slate-400"></span>
                    <span id="sync-text" class="font-medium text-[11px] sm:text-xs">未綁定 Google 試算表</span>
                </div>
            </div>

            <div class="mt-3 pt-2.5 border-t border-white/10 space-y-2 text-xs">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex-1 flex items-center space-x-2 bg-slate-900/80 border border-white/10 rounded-lg px-2.5 py-1.5 min-w-[240px]">
                        <i class="fa-solid fa-table text-emerald-400 text-xs"></i>
                        <span class="text-slate-300 whitespace-nowrap text-[11px]">GAS 雲端網址:</span>
                        <input type="text" id="gas-url-input" placeholder="貼上 Google Apps Script 部署網址 (https://script.google.com/...)" class="w-full bg-slate-800 text-emerald-300 font-mono text-[11px] px-2 py-0.5 rounded border border-slate-700 focus:outline-none focus:border-emerald-400 truncate" />
                    </div>

                    <div class="flex items-center space-x-2">
                        <button onclick="saveGasUrl()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold px-3 py-1.5 rounded-lg border border-slate-600 transition-all text-xs">
                            儲存網址
                        </button>
                        <button onclick="syncWithGoogleSheets()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1.5 shadow-md border border-blue-400/30 transition-all text-xs">
                            <i class="fa-solid fa-rotate text-xs" id="sync-icon"></i>
                            <span>🔄 手動同步 (Sync)</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4">

        <nav class="flex space-x-1 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200/80 mb-4 overflow-x-auto no-scrollbar">
            <button onclick="switchTab('itinerary')" id="tab-btn-itinerary" class="tab-btn flex-1 min-w-[75px] py-2 px-3 text-xs sm:text-sm font-bold rounded-xl transition-all text-blue-900 bg-blue-50 shadow-sm border border-blue-200/50">
                <i class="fa-solid fa-calendar-days mr-1 text-blue-600"></i> 每日行程
            </button>
            <button onclick="switchTab('overview')" id="tab-btn-overview" class="tab-btn flex-1 min-w-[75px] py-2 px-3 text-xs sm:text-sm font-bold text-slate-500 rounded-xl hover:text-slate-900 transition-all">
                <i class="fa-solid fa-plane-arrival mr-1"></i> 總覽與住宿
            </button>
            <button onclick="switchTab('tickets')" id="tab-btn-tickets" class="tab-btn flex-1 min-w-[75px] py-2 px-3 text-xs sm:text-sm font-bold text-slate-500 rounded-xl hover:text-slate-900 transition-all">
                <i class="fa-solid fa-ticket mr-1"></i> 門票交通
            </button>
            <button onclick="switchTab('packing')" id="tab-btn-packing" class="tab-btn flex-1 min-w-[75px] py-2 px-3 text-xs sm:text-sm font-bold text-slate-500 rounded-xl hover:text-slate-900 transition-all">
                <i class="fa-solid fa-suitcase mr-1"></i> 行李清單
            </button>
            <button onclick="switchTab('budget')" id="tab-btn-budget" class="tab-btn flex-1 min-w-[75px] py-2 px-3 text-xs sm:text-sm font-bold text-slate-500 rounded-xl hover:text-slate-900 transition-all">
                <i class="fa-solid fa-calculator mr-1"></i> 記帳外幣
            </button>
        </nav>

        <section id="tab-itinerary" class="tab-content space-y-4">
            <div id="day-selector" class="flex space-x-2 overflow-x-auto pb-1 no-scrollbar">
                <!-- Dynamically populated -->
            </div>

            <div class="bg-gradient-to-r from-slate-900 via-indigo-900 to-blue-900 text-white rounded-2xl p-4 shadow-sm flex justify-between items-center border border-slate-800">
                <div>
                    <h2 id="day-header-title" class="text-base sm:text-lg font-bold">載入行程中...</h2>
                    <p id="day-header-desc" class="text-xs text-blue-200/80 mt-0.5"></p>
                </div>
                <button onclick="openGoogleMapSearch()" class="bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-1.5 rounded-lg border border-white/20 flex items-center transition-all">
                    <i class="fa-solid fa-location-dot mr-1.5 text-amber-400"></i>地圖搜尋
                </button>
            </div>

            <div id="timeline-container" class="space-y-3 relative before:absolute before:inset-0 before:left-3.5 before:w-0.5 before:bg-slate-200">
                <!-- Dynamically populated timeline -->
            </div>

            <button onclick="showAddModal()" class="w-full py-3 bg-white border-2 border-dashed border-slate-300 text-slate-600 font-bold text-xs sm:text-sm rounded-2xl hover:border-blue-500 hover:text-blue-600 transition-all flex items-center justify-center space-x-2 shadow-sm">
                <i class="fa-solid fa-plus text-blue-600"></i>
                <span>新增此日行程項目</span>
            </button>
        </section>

        <section id="tab-overview" class="tab-content hidden space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                    <div class="flex items-center space-x-2 text-slate-900 font-bold border-b pb-2.5">
                        <i class="fa-solid fa-plane-departure text-amber-500 text-lg"></i>
                        <span>航班 / 交通資訊</span>
                    </div>
                    <div id="overview-flight-details" class="text-xs space-y-2.5 text-slate-600">
                        <!-- Dynamic rendering -->
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                    <div class="flex items-center space-x-2 text-slate-900 font-bold border-b pb-2.5">
                        <i class="fa-solid fa-hotel text-amber-500 text-lg"></i>
                        <span>住宿飯店資訊</span>
                    </div>
                    <div id="overview-hotel-details" class="text-xs space-y-2 text-slate-600">
                        <!-- Dynamic rendering -->
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-tickets" class="tab-content hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-slate-800">景點門票與交通票券</h2>
                    <p class="text-xs text-slate-500">預訂狀態與預約時間記錄</p>
                </div>
                <button onclick="addTicket()" class="bg-blue-900 text-white text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-blue-800 transition-all">
                    <i class="fa-solid fa-plus mr-1"></i>新增票券
                </button>
            </div>

            <div id="tickets-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <!-- Dynamic loading -->
            </div>
        </section>

        <section id="tab-packing" class="tab-content hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-slate-800">行李準備清單</h2>
                    <span id="packing-progress" class="text-xs font-bold text-blue-900 bg-blue-50 px-2.5 py-1 rounded-full">0/0 完成</span>
                </div>
                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                    <div id="packing-progress-bar" class="bg-emerald-500 h-full transition-all duration-300 w-0"></div>
                </div>
            </div>

            <div id="packing-categories" class="space-y-4">
                <!-- Dynamically populated -->
            </div>
        </section>

        <section id="tab-budget" class="tab-content hidden space-y-4">
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm text-center">
                    <p id="currency-label" class="text-xs text-slate-500 mb-1">總支出 (外幣)</p>
                    <p id="total-foreign" class="text-xl font-black text-blue-900">0</p>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm text-center">
                    <p class="text-xs text-slate-500 mb-1">折合台幣 (TWD)</p>
                    <p id="total-twd" class="text-xl font-black text-amber-600">NT$0</p>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm text-center col-span-2 sm:col-span-1">
                    <p class="text-xs text-slate-500 mb-1">匯率設定</p>
                    <p id="rate-display" class="text-sm font-bold text-slate-700 mt-1">1 Foreign ≈ TWD</p>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold text-slate-800">費用明細</h3>
                    <button onclick="addExpense()" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-500 transition-all">
                        <i class="fa-solid fa-plus mr-1"></i>新增消費
                    </button>
                </div>
                <div id="expenses-list" class="divide-y divide-slate-100">
                    <!-- Dynamic rendering -->
                </div>
            </div>
        </section>

    </main>

    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modal-title" class="font-bold text-base text-slate-800">新增行程</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-600 font-semibold mb-1">時間 (如 09:00 或 隨時)</label>
                    <input type="text" id="modal-time" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="09:00">
                </div>
                <div>
                    <label class="block text-slate-600 font-semibold mb-1">標題 / 景點名稱</label>
                    <input type="text" id="modal-item-title" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="東京鐵塔 / 羅浮宮">
                </div>
                <div>
                    <label class="block text-slate-600 font-semibold mb-1">細節 / 備註說明</label>
                    <textarea id="modal-desc" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none h-20" placeholder="門票預約時間、必買或交通搭乘指南"></textarea>
                </div>
                <div>
                    <label class="block text-slate-600 font-semibold mb-1">估算預算 (NT$)</label>
                    <input type="number" id="modal-cost" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0">
                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200">取消</button>
                <button onclick="saveModalItem()" class="flex-1 py-2.5 bg-blue-900 text-white font-bold rounded-xl hover:bg-blue-800 shadow">儲存變更</button>
            </div>
        </div>
    </div>

    <div id="new-trip-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-base text-slate-800">➕ 快速新增 / 建立新行程</h3>
                <button onclick="closeNewTripModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-600 font-semibold mb-1">行程名稱 (例如: 東京 櫻花季 2028)</label>
                    <input type="text" id="new-trip-name" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="東京自由行 2028">
                </div>
                <div>
                    <label class="block text-slate-600 font-semibold mb-1">選擇熱門預設模版 (可快速帶入天數與預設清單)</label>
                    <select id="new-trip-template" onchange="applyTemplateDefaults()" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="custom">空白新行程 (完全自訂)</option>
                        <option value="tokyo">🗾 日本東京 5天4夜 經典行程</option>
                        <option value="kyoto">⛩️ 日本關西京都 4天3夜 古都行</option>
                        <option value="paris">🇫🇷 法國巴黎 7天6夜 藝術城堡</option>
                        <option value="iceland">❄️ 冰島極光自駕 8天7夜</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-600 font-semibold mb-1">國家簡碼 (如 JP/FR/US)</label>
                        <input type="text" id="new-trip-country" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none uppercase" placeholder="JP">
                    </div>
                    <div>
                        <label class="block text-slate-600 font-semibold mb-1">外幣幣別代碼</label>
                        <input type="text" id="new-trip-currency" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none uppercase" placeholder="JPY">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-600 font-semibold mb-1">參考匯率 (1外幣 ≈ 多少台幣 TWD)</label>
                    <input type="number" step="0.0001" id="new-trip-rate" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0.22">
                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeNewTripModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200">取消</button>
                <button onclick="createNewTrip()" class="flex-1 py-2.5 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-500 shadow">建立行程</button>
            </div>
        </div>
    </div>

    <script>
        // Preset Trip Templates for Quick Creation
        const presetTemplates = {
            tokyo: {
                country: "JP", currency: "JPY", rate: 0.22,
                flight: "去程：星宇航空 JX800 (TPE ➔ NRT)\n回程：星宇航空 JX801 (NRT ➔ TPE)",
                hotel: "Shibuya Stream Excel Hotel Tokyu (澀谷)",
                days: [
                    { date: "Day 1", week: "一", title: "抵達東京・澀谷晴空塔", items: [
                        { time: "12:00", title: "✈️ 成田機場抵達 & 搭乘 Skyliner", desc: "購買 Skyliner + 東京地鐵 72 小時券", cost: 500 },
                        { time: "15:00", title: "🏨 飯店 Check-in & 澀谷 Sky 觀景台", desc: "預約 16:30 日落場次俯瞰東京夜景", cost: 600 },
                        { time: "19:00", title: "🍜 敘敘苑燒肉 (澀谷店)", desc: "享用高空景觀燒肉晚餐", cost: 2000 }
                    ]},
                    { date: "Day 2", week: "二", title: "淺草寺文化與晴空塔逛街", items: [
                        { time: "09:30", title: "⛩️ 淺草寺 & 仲見世通散步", desc: "參拜求籤、品嚐人形燒與抹茶冰淇淋", cost: 200 },
                        { time: "13:00", title: "🗼 東京晴空塔 (Tokyo Skytree)", desc: "登上 350m 展望台，晴空街道購物", cost: 800 }
                    ]},
                    { date: "Day 3", week: "三", title: "東京迪士尼樂園歡樂一日遊", items: [
                        { time: "08:00", title: "🏰 東京迪士尼樂園 (Disneyland)", desc: "體驗美女與野獸、美女與野獸城堡燈光秀", cost: 2400 }
                    ]}
                ],
                tickets: [{ title: "Tokyo Subway 72hr Ticket", status: "已預約", date: "Day 1-3 通用", note: "機場兌換" }],
                packing: [
                    { category: "證件與外幣", items: [{ name: "護照", checked: true }, { name: "日圓現金 (建議 5-10萬)", checked: true }, { name: "Visit Japan Web 填寫", checked: true }] },
                    { category: "電子產品", items: [{ name: "日本 eSIM / 網卡", checked: true }, { name: "行動電源", checked: true }] }
                ],
                expenses: [{ desc: "迪士尼樂園門票", eur: 10000, twd: 2200, payer: "公費" }]
            },
            paris: {
                country: "FR", currency: "EUR", rate: 35,
                flight: "去程：長榮航空 BR87 (07:45 抵達 CDG)\n回程：長榮航空 BR88 (11:20 起飛)",
                hotel: "CitizenM Paris Gare de Lyon (8 Rue de Van Gogh, Paris)",
                days: [
                    { date: "2/3-2/4", week: "三→四", title: "初抵巴黎・經典地標與塞納河畔", items: [
                        { time: "07:45", title: "✈️ 戴高樂機場 (CDG) 抵達與入境", desc: "辦理入境與提領行李，購買 Navigo 週票", cost: 0 },
                        { time: "14:00", title: "🗼 艾菲爾鐵塔 & 戰神廣場", desc: "經典地標巡禮，登上鐵塔觀景台", cost: 1200 },
                        { time: "17:30", title: "🚢 塞納河景觀遊船", desc: "乘船欣賞巴黎聖母院與兩岸夜景", cost: 650 }
                    ]},
                    { date: "2/5", week: "五", title: "藝術巡禮・羅浮宮與左岸咖啡時光", items: [
                        { time: "09:00", title: "🖼️ 羅浮宮博物館", desc: "預約快速通關，欣賞蒙娜麗莎", cost: 800 },
                        { time: "15:00", title: "☕ 花神咖啡館 (Café de Flore)", desc: "體驗左岸人文氣息與下午茶", cost: 650 }
                    ]}
                ],
                tickets: [{ title: "羅浮宮門票", status: "已預約", date: "2/5 09:30", note: "預約號碼: LUV-889" }],
                packing: [{ category: "重要證件", items: [{ name: "護照與影本", checked: true }, { name: "申根保險單", checked: false }] }],
                expenses: [{ desc: "巴黎飯店 7晚", eur: 1200, twd: 42000, payer: "公費" }]
            }
        };

        // Multi-Trip Master Data Object
        let masterData = {
            activeTripId: "paris_2027",
            trips: {
                "paris_2027": {
                    id: "paris_2027",
                    name: "巴黎 Bonjour 2027",
                    country: "FR",
                    currency: "EUR",
                    rate: 35,
                    activeDayIndex: 0,
                    flight: "去程：長榮 BR87 | 回程：長榮 BR88",
                    hotel: "CitizenM Paris Gare de Lyon",
                    days: presetTemplates.paris.days,
                    tickets: presetTemplates.paris.tickets,
                    packing: presetTemplates.paris.packing,
                    expenses: presetTemplates.paris.expenses
                }
            }
        };

        let gasUrl = localStorage.getItem('paris_gas_url') || "";
        let editItemIndex = null;

        let undoStack = [];
        const MAX_UNDO = 20;

        window.onload = function() {
            initLocalStorage();
            if (gasUrl) {
                document.getElementById('gas-url-input').value = gasUrl;
                updateSyncBadge(true, "🟢 Google 雲端連線中");
                syncWithGoogleSheets(true);
            }
            renderAll();
            updateUndoButtonState();

            window.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
                    e.preventDefault();
                    undoLastAction();
                }
            });
        };

        function recordStateForUndo() {
            if (undoStack.length >= MAX_UNDO) {
                undoStack.shift();
            }
            undoStack.push(JSON.stringify(masterData));
            updateUndoButtonState();
        }

        function undoLastAction() {
            if (undoStack.length === 0) {
                showToast("沒有可復原的上一步紀錄");
                return;
            }
            const previousStateJSON = undoStack.pop();
            try {
                masterData = JSON.parse(previousStateJSON);
                localStorage.setItem('multi_travel_app_data', JSON.stringify(masterData));
                if (gasUrl) {
                    pushDataToGoogleSheets();
                }
                renderAll();
                updateUndoButtonState();
                showToast("↩️ 已成功復原上一步操作！");
            } catch (err) {
                console.error("Undo error:", err);
            }
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undo-btn');
            const undoCount = document.getElementById('undo-count');
            if (undoBtn) {
                if (undoStack.length > 0) {
                    undoBtn.disabled = false;
                    undoBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    undoBtn.classList.add('hover:text-white');
                    if (undoCount) undoCount.textContent = `(${undoStack.length})`;
                } else {
                    undoBtn.disabled = true;
                    undoBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    if (undoCount) undoCount.textContent = '';
                }
            }
        }

        function getCurrentTrip() {
            return masterData.trips[masterData.activeTripId] || Object.values(masterData.trips)[0];
        }

        function initLocalStorage() {
            const local = localStorage.getItem('multi_travel_app_data');
            if (local) {
                try { 
                    masterData = JSON.parse(local); 
                    if (!masterData.trips || Object.keys(masterData.trips).length === 0) {
                        throw new Error("Invalid structure");
                    }
                } catch(e) { 
                    console.error("Resetting masterData", e); 
                }
            } else {
                saveLocal();
            }
        }

        function saveLocal() {
            localStorage.setItem('multi_travel_app_data', JSON.stringify(masterData));
            if (gasUrl) {
                pushDataToGoogleSheets();
            }
        }

        function saveGasUrl() {
            const inputVal = document.getElementById('gas-url-input').value.trim();
            if (!inputVal) {
                showToast("請貼上正確的 Google Apps Script Web App 網址");
                return;
            }
            gasUrl = inputVal;
            localStorage.setItem('paris_gas_url', gasUrl);
            updateSyncBadge(true, "🟢 Google 試算表已綁定");
            showToast("成功儲存 Google Apps Script 網址！");
            syncWithGoogleSheets();
        }

        async function syncWithGoogleSheets(isSilent = false) {
            if (!gasUrl) {
                if (!isSilent) showToast("請先輸入並儲存 GAS Web App 網址");
                return;
            }

            const syncIcon = document.getElementById('sync-icon');
            if (syncIcon) syncIcon.classList.add('animate-spin');

            try {
                const response = await fetch(gasUrl);
                if (response.ok) {
                    const fetchedData = await response.json();
                    if (fetchedData && fetchedData.trips) {
                        masterData = fetchedData;
                        localStorage.setItem('multi_travel_app_data', JSON.stringify(masterData));
                        renderAll();
                        updateSyncBadge(true, "🟢 Google 雲端已同步");
                        if (!isSilent) showToast("已成功載入雲端最新多國行程！");
                    } else {
                        await pushDataToGoogleSheets();
                    }
                }
            } catch (err) {
                console.error("Sync error:", err);
                updateSyncBadge(false, "🔴 雲端連線失敗");
                if (!isSilent) showToast("連線 Google 試算表失敗，請檢查網址與權限");
            } finally {
                if (syncIcon) syncIcon.classList.remove('animate-spin');
            }
        }

        async function pushDataToGoogleSheets() {
            if (!gasUrl) return;
            try {
                await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(masterData)
                });
                updateSyncBadge(true, "🟢 雲端已同步");
            } catch (err) {
                console.error("Push error:", err);
            }
        }

        function updateSyncBadge(isOk, text) {
            const dot = document.getElementById('sync-dot');
            const textEl = document.getElementById('sync-text');
            if (textEl) textEl.textContent = text;
            if (dot) {
                dot.className = `w-2 h-2 rounded-full ${isOk ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500'}`;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.textContent = msg;
            toast.classList.remove('-translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.add('-translate-y-20', 'opacity-0', 'pointer-events-none');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 2500);
        }

        function renderTripSelector() {
            const select = document.getElementById('trip-selector');
            select.innerHTML = '';
            Object.values(masterData.trips).forEach(trip => {
                const opt = document.createElement('option');
                opt.value = trip.id;
                opt.textContent = trip.name;
                if (trip.id === masterData.activeTripId) opt.selected = true;
                select.appendChild(opt);
            });

            const current = getCurrentTrip();
            document.getElementById('trip-country-tag').textContent = current.country || "TRIP";
        }

        function switchTrip(tripId) {
            recordStateForUndo();
            masterData.activeTripId = tripId;
            saveLocal();
            renderAll();
            showToast(`已切換至：${getCurrentTrip().name}`);
        }

        function openNewTripModal() {
            document.getElementById('new-trip-name').value = "";
            document.getElementById('new-trip-country').value = "JP";
            document.getElementById('new-trip-currency').value = "JPY";
            document.getElementById('new-trip-rate').value = "0.22";
            document.getElementById('new-trip-modal').classList.remove('hidden');
        }

        function closeNewTripModal() {
            document.getElementById('new-trip-modal').classList.add('hidden');
        }

        function applyTemplateDefaults() {
            const tKey = document.getElementById('new-trip-template').value;
            if (presetTemplates[tKey]) {
                const t = presetTemplates[tKey];
                document.getElementById('new-trip-country').value = t.country;
                document.getElementById('new-trip-currency').value = t.currency;
                document.getElementById('new-trip-rate').value = t.rate;
            }
        }

        function createNewTrip() {
            recordStateForUndo();
            const name = document.getElementById('new-trip-name').value.trim() || "新旅遊行程";
            const templateKey = document.getElementById('new-trip-template').value;
            const country = (document.getElementById('new-trip-country').value || "JP").toUpperCase();
            const currency = (document.getElementById('new-trip-currency').value || "JPY").toUpperCase();
            const rate = Number(document.getElementById('new-trip-rate').value || 1);

            const newId = 'trip_' + Date.now();
            
            let templateData = presetTemplates[templateKey] || {
                days: [{ date: "Day 1", week: "一", title: "第一天行程重點", items: [] }],
                tickets: [],
                packing: [{ category: "隨身物品", items: [{ name: "護照", checked: true }] }],
                expenses: []
            };

            masterData.trips[newId] = {
                id: newId,
                name: name,
                country: country,
                currency: currency,
                rate: rate,
                activeDayIndex: 0,
                flight: templateData.flight || "尚未輸入航班資訊",
                hotel: templateData.hotel || "尚未輸入住宿資訊",
                days: JSON.parse(JSON.stringify(templateData.days)),
                tickets: JSON.parse(JSON.stringify(templateData.tickets || [])),
                packing: JSON.parse(JSON.stringify(templateData.packing || [])),
                expenses: JSON.parse(JSON.stringify(templateData.expenses || []))
            };

            masterData.activeTripId = newId;
            saveLocal();
            closeNewTripModal();
            renderAll();
            showToast(`成功建立並切換至「${name}」！`);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-50', 'text-blue-900', 'shadow-sm', 'border', 'border-blue-200/50');
                btn.classList.add('text-slate-500');
            });

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-btn-${tabId}`);
            activeBtn.classList.add('bg-blue-50', 'text-blue-900', 'shadow-sm', 'border', 'border-blue-200/50');
            activeBtn.classList.remove('text-slate-500');
        }

        function renderAll() {
            renderTripSelector();
            renderDaySelector();
            renderTimeline();
            renderOverview();
            renderTickets();
            renderPacking();
            renderBudget();
        }

        function renderDaySelector() {
            const currentTrip = getCurrentTrip();
            const container = document.getElementById('day-selector');
            container.innerHTML = '';
            
            currentTrip.days.forEach((day, index) => {
                const active = index === currentTrip.activeDayIndex;
                const btn = document.createElement('button');
                btn.className = `px-3 py-2 rounded-xl text-center min-w-[68px] transition-all flex-shrink-0 ${
                    active ? 'bg-blue-900 text-white font-bold shadow-md scale-105' : 'bg-white text-slate-600 hover:bg-slate-50 border border-slate-200'
                }`;
                btn.onclick = () => {
                    currentTrip.activeDayIndex = index;
                    saveLocal();
                    renderDaySelector();
                    renderTimeline();
                };
                btn.innerHTML = `
                    <div class="text-[10px] opacity-80">${day.week}</div>
                    <div class="text-sm font-bold">${day.date}</div>
                `;
                container.appendChild(btn);
            });
        }

        function renderTimeline() {
            const currentTrip = getCurrentTrip();
            const currentDay = currentTrip.days[currentTrip.activeDayIndex] || currentTrip.days[0];
            
            document.getElementById('day-header-title').textContent = `${currentDay.date} (${currentDay.week}) - ${currentDay.title}`;
            document.getElementById('day-header-desc').textContent = `共 ${currentDay.items.length} 個行程景點`;

            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            currentDay.items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = "relative pl-8";
                card.innerHTML = `
                    <div class="absolute left-2 top-3 w-3 h-3 rounded-full bg-amber-500 border-2 border-white shadow"></div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all">
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">${item.time}</span>
                            <div class="space-x-1">
                                <button onclick="editModalItem(${idx})" class="text-xs text-slate-400 hover:text-blue-600 p-1"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteItem(${idx})" class="text-xs text-slate-400 hover:text-rose-600 p-1"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <h4 class="font-bold text-slate-800 text-sm mt-1.5">${item.title}</h4>
                        <p class="text-xs text-slate-500 mt-1 leading-relaxed">${item.desc || ''}</p>
                        ${item.cost ? `<div class="mt-2 text-xs font-semibold text-slate-600"><i class="fa-solid fa-coins text-amber-500 mr-1"></i>NT$ ${item.cost}</div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderOverview() {
            const trip = getCurrentTrip();
            document.getElementById('overview-flight-details').innerHTML = `
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <p class="whitespace-pre-line text-slate-700">${trip.flight || '尚無班機資料'}</p>
                </div>
            `;
            document.getElementById('overview-hotel-details').innerHTML = `
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span class="font-bold text-slate-900 text-sm">${trip.hotel || '尚無住宿資料'}</span>
                </div>
            `;
        }

        function renderTickets() {
            const trip = getCurrentTrip();
            const container = document.getElementById('tickets-list');
            container.innerHTML = '';
            trip.tickets.forEach((t, i) => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm flex justify-between items-center";
                card.innerHTML = `
                    <div class="space-y-1">
                        <span class="text-[10px] bg-blue-50 text-blue-800 font-bold px-2 py-0.5 rounded-full">${t.status}</span>
                        <h4 class="font-bold text-slate-800 text-sm">${t.title}</h4>
                        <p class="text-xs text-slate-500"><i class="fa-regular fa-clock mr-1"></i>${t.date}</p>
                        <p class="text-[11px] text-slate-400">${t.note}</p>
                    </div>
                    <button onclick="deleteTicket(${i})" class="text-xs text-slate-300 hover:text-rose-500 p-2"><i class="fa-solid fa-trash"></i></button>
                `;
                container.appendChild(card);
            });
        }

        function renderPacking() {
            const trip = getCurrentTrip();
            const container = document.getElementById('packing-categories');
            container.innerHTML = '';
            let total = 0, checkedCount = 0;

            trip.packing.forEach((cat, cIdx) => {
                const group = document.createElement('div');
                group.className = "bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm space-y-2";
                
                let itemsHtml = '';
                cat.items.forEach((item, iIdx) => {
                    total++;
                    if(item.checked) checkedCount++;
                    itemsHtml += `
                        <label class="flex items-center space-x-3 p-1.5 hover:bg-slate-50 rounded-lg cursor-pointer text-xs">
                            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="togglePacking(${cIdx}, ${iIdx})" class="w-4 h-4 text-blue-900 rounded focus:ring-blue-500 border-slate-300">
                            <span class="${item.checked ? 'line-through text-slate-400' : 'text-slate-700 font-medium'}">${item.name}</span>
                        </label>
                    `;
                });

                group.innerHTML = `
                    <h3 class="font-bold text-sm text-slate-800 border-b pb-1.5 flex items-center justify-between">
                        <span>${cat.category}</span>
                    </h3>
                    <div class="divide-y divide-slate-50">${itemsHtml}</div>
                `;
                container.appendChild(group);
            });

            const pct = total === 0 ? 0 : Math.round((checkedCount / total) * 100);
            document.getElementById('packing-progress').textContent = `${checkedCount}/${total} (${pct}%)`;
            document.getElementById('packing-progress-bar').style.width = `${pct}%`;
        }

        function renderBudget() {
            const trip = getCurrentTrip();
            const container = document.getElementById('expenses-list');
            container.innerHTML = '';
            let totalForeign = 0;
            let totalTwd = 0;

            document.getElementById('currency-label').textContent = `總支出 (${trip.currency})`;
            document.getElementById('rate-display').textContent = `1 ${trip.currency} ≈ ${trip.rate} TWD`;

            trip.expenses.forEach((e, i) => {
                const foreignAmt = Number(e.eur || e.amount || 0);
                const twdAmt = Number(e.twd || (foreignAmt * trip.rate));

                totalForeign += foreignAmt;
                totalTwd += twdAmt;

                const item = document.createElement('div');
                item.className = "py-2.5 flex justify-between items-center text-xs";
                item.innerHTML = `
                    <div>
                        <p class="font-bold text-slate-800">${e.desc}</p>
                        <span class="text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">付款人: ${e.payer || '公費'}</span>
                    </div>
                    <div class="text-right flex items-center space-x-3">
                        <div>
                            <p class="font-bold text-slate-800">${trip.currency} ${foreignAmt}</p>
                            <p class="text-[10px] text-slate-400">NT$ ${Math.round(twdAmt)}</p>
                        </div>
                        <button onclick="deleteExpense(${i})" class="text-slate-300 hover:text-rose-500 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(item);
            });

            document.getElementById('total-foreign').textContent = `${trip.currency} ${totalForeign}`;
            document.getElementById('total-twd').textContent = `NT$ ${Math.round(totalTwd)}`;
        }

        function togglePacking(cIdx, iIdx) {
            recordStateForUndo();
            const trip = getCurrentTrip();
            trip.packing[cIdx].items[iIdx].checked = !trip.packing[cIdx].items[iIdx].checked;
            saveLocal();
            renderPacking();
        }

        function showAddModal() {
            editItemIndex = null;
            document.getElementById('modal-title').textContent = "新增行程景點";
            document.getElementById('modal-time').value = "";
            document.getElementById('modal-item-title').value = "";
            document.getElementById('modal-desc').value = "";
            document.getElementById('modal-cost').value = "";
            document.getElementById('modal').classList.remove('hidden');
        }

        function editModalItem(idx) {
            editItemIndex = idx;
            const trip = getCurrentTrip();
            const item = trip.days[trip.activeDayIndex].items[idx];
            document.getElementById('modal-title').textContent = "編輯行程景點";
            document.getElementById('modal-time').value = item.time || "";
            document.getElementById('modal-item-title').value = item.title || "";
            document.getElementById('modal-desc').value = item.desc || "";
            document.getElementById('modal-cost').value = item.cost || "";
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveModalItem() {
            recordStateForUndo();
            const time = document.getElementById('modal-time').value || "隨時";
            const title = document.getElementById('modal-item-title').value || "未命名地點";
            const desc = document.getElementById('modal-desc').value || "";
            const cost = Number(document.getElementById('modal-cost').value || 0);

            const trip = getCurrentTrip();
            const currentItems = trip.days[trip.activeDayIndex].items;

            if (editItemIndex !== null) {
                currentItems[editItemIndex] = { time, title, desc, cost };
            } else {
                currentItems.push({ time, title, desc, cost });
            }

            saveLocal();
            closeModal();
            renderTimeline();
        }

        function deleteItem(idx) {
            recordStateForUndo();
            const trip = getCurrentTrip();
            trip.days[trip.activeDayIndex].items.splice(idx, 1);
            saveLocal();
            renderTimeline();
        }

        function addTicket() {
            const title = prompt("請輸入票券名稱:", "景點 / 交通門票");
            if (!title) return;
            const date = prompt("請輸入預約時間/使用日期:", "Day 1");
            recordStateForUndo();
            const trip = getCurrentTrip();
            trip.tickets.push({ title, status: "已預約", date: date || "未確定", note: "請確認 QR Code" });
            saveLocal();
            renderTickets();
        }

        function deleteTicket(i) {
            recordStateForUndo();
            const trip = getCurrentTrip();
            trip.tickets.splice(i, 1);
            saveLocal();
            renderTickets();
        }

        function addExpense() {
            const trip = getCurrentTrip();
            const desc = prompt("請輸入消費項目名稱:", "餐廳晚餐 / 紀念品");
            if (!desc) return;
            const foreignAmt = Number(prompt(`請輸入金額 (${trip.currency}):`, "1000") || 0);
            recordStateForUndo();
            const twdAmt = foreignAmt * trip.rate;
            trip.expenses.push({ desc, eur: foreignAmt, twd: twdAmt, payer: "公費" });
            saveLocal();
            renderBudget();
        }

        function deleteExpense(i) {
            recordStateForUndo();
            const trip = getCurrentTrip();
            trip.expenses.splice(i, 1);
            saveLocal();
            renderBudget();
        }

        function openGoogleMapSearch() {
            const trip = getCurrentTrip();
            const currentDay = trip.days[trip.activeDayIndex];
            window.open(`https://www.google.com/maps/search/${encodeURIComponent(trip.name)}+${encodeURIComponent(currentDay.title)}`, '_blank');
        }
    </script>
</body>
</html>

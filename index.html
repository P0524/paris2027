<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>巴黎與多國行程 2027</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .tab-active { background-color: #e0e7ff; color: #4338ca; font-weight: bold; border: 2px solid #312e81; }
        .tab-inactive { background-color: white; color: #64748b; font-weight: normal; border: 2px solid transparent; }
        
        /* Custom Scrollbar for better look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Drag and Drop styles */
        .dragging { opacity: 0.5; }
        .drop-zone { border-top: 2px dashed #6366f1; margin-top: -2px; }
        
        /* Hide scrollbar utility class */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <header class="bg-indigo-900 text-white p-4 shadow-lg sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex flex-col space-y-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <span class="bg-amber-400 text-indigo-900 font-extrabold px-2 py-1 rounded text-sm">FR</span>
                    <select id="trip-selector" onchange="switchTrip()" class="bg-indigo-800/80 border border-indigo-700 text-white font-bold text-lg rounded-lg px-2 py-1 outline-none focus:ring-2 focus:ring-amber-400 cursor-pointer">
                        <option value="paris">巴黎 Bonjour 2027</option>
                    </select>
                </div>
                <div class="flex space-x-2">
                    <button onclick="createNewTrip()" class="bg-emerald-500 hover:bg-emerald-400 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition-colors flex items-center">
                        ➕ 新增/複製行程
                    </button>
                    <button onclick="undo()" class="bg-indigo-700 hover:bg-indigo-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition-colors flex items-center" title="復原 (Ctrl+Z)">
                        ↩️ 復原
                    </button>
                </div>
            </div>

            <!-- Sync Controls -->
            <div class="bg-indigo-950/50 p-2.5 rounded-xl border border-indigo-800/50 flex flex-wrap gap-2 items-center justify-between text-sm">
                <div class="flex items-center space-x-2 flex-1 min-w-[200px]">
                    <span class="text-indigo-200 text-xs whitespace-nowrap">🟩 GAS 雲端網址:</span>
                    <input type="text" id="gas-url" placeholder="https://script.google.com/macros/s/.../exec" class="flex-1 bg-indigo-900 border border-indigo-700 rounded px-2 py-1 text-xs text-indigo-100 outline-none focus:border-indigo-400 font-mono">
                    <button onclick="saveGasUrl()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs transition-colors whitespace-nowrap">儲存網址</button>
                </div>
                <div class="flex space-x-2">
                    <button onclick="syncWithCloud()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded-lg text-xs font-bold flex items-center shadow-md transition-all whitespace-nowrap">
                        🔄 手動同步 (Sync)
                    </button>
                    <span id="sync-status" class="bg-slate-800/80 px-2 py-1 rounded-full text-[11px] flex items-center text-slate-400 border border-slate-700 whitespace-nowrap">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-500 mr-1.5"></span> 尚未綁定雲端
                    </span>
                </div>
            </div>
        </div>
    </header>

    <nav class="max-w-4xl mx-auto mt-4 px-4">
        <div class="bg-white rounded-2xl shadow-sm p-1.5 flex overflow-x-auto hide-scrollbar space-x-1">
            <button onclick="switchTab('itinerary')" id="tab-itinerary" class="tab-active flex-1 min-w-[100px] py-2.5 px-3 rounded-xl text-sm transition-all flex items-center justify-center space-x-2 whitespace-nowrap">
                <span class="text-lg">📅</span> <span>每日行程</span>
            </button>
            <button onclick="switchTab('accommodation')" id="tab-accommodation" class="tab-inactive flex-1 min-w-[100px] py-2.5 px-3 rounded-xl text-sm transition-all flex items-center justify-center space-x-2 whitespace-nowrap">
                <span class="text-lg">✈️</span> <span>航班住宿</span>
            </button>
            <button onclick="switchTab('tickets')" id="tab-tickets" class="tab-inactive flex-1 min-w-[100px] py-2.5 px-3 rounded-xl text-sm transition-all flex items-center justify-center space-x-2 whitespace-nowrap">
                <span class="text-lg">🎟️</span> <span>門票交通</span>
            </button>
            <button onclick="switchTab('packing')" id="tab-packing" class="tab-inactive flex-1 min-w-[100px] py-2.5 px-3 rounded-xl text-sm transition-all flex items-center justify-center space-x-2 whitespace-nowrap">
                <span class="text-lg">🎒</span> <span>行李清單</span>
            </button>
            <button onclick="switchTab('budget')" id="tab-budget" class="tab-inactive flex-1 min-w-[100px] py-2.5 px-3 rounded-xl text-sm transition-all flex items-center justify-center space-x-2 whitespace-nowrap">
                <span class="text-lg">💰</span> <span>預算</span>
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-6 px-4">
        
        <!-- Tab: Itinerary (每日行程) -->
        <div id="view-itinerary" class="space-y-6">
            <!-- Day Selector -->
            <div id="day-tabs" class="flex overflow-x-auto space-x-2 pb-2 hide-scrollbar">
                <!-- Generated by JS -->
            </div>
            
            <div class="bg-white rounded-3xl p-5 sm:p-8 shadow-sm">
                <!-- Day Header & Navigation -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-100 pb-6">
                    <div>
                        <h2 id="day-title" class="text-2xl font-black text-slate-800"></h2>
                        <p id="day-subtitle" class="text-slate-500 text-sm mt-1.5 leading-relaxed"></p>
                    </div>
                    <button onclick="openDailyRouteMap()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2.5 rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center space-x-2 whitespace-nowrap flex-shrink-0">
                        <span class="text-lg">🧭</span> <span>開啟今日路線導航</span>
                    </button>
                </div>
                
                <!-- Timeline container (Adjusted for mobile time text) -->
                <div id="timeline" class="relative border-l-2 border-slate-200 ml-[85px] sm:ml-[100px] pb-6 space-y-6 mt-4">
                    <!-- Items generated by JS -->
                </div>
                
                <button onclick="showAddModal()" class="w-full mt-4 py-4 border-2 border-dashed border-slate-200 text-slate-500 font-bold rounded-2xl hover:bg-slate-50 hover:border-slate-300 transition-all flex items-center justify-center space-x-2 group">
                    <span class="text-xl group-hover:scale-125 transition-transform">➕</span> <span>新增此日行程項目</span>
                </button>
            </div>
        </div>

        <!-- Tab: Accommodation & Flights (航班住宿) -->
        <div id="view-accommodation" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Flight Info -->
                <div class="bg-white rounded-3xl p-6 shadow-sm relative group">
                    <button onclick="editFlightInfo()" class="absolute top-5 right-5 text-slate-400 hover:text-blue-600 transition-colors bg-slate-50 p-2 rounded-lg opacity-100 sm:opacity-0 group-hover:opacity-100" title="編輯航班">✏️</button>
                    <h3 class="font-black text-lg text-slate-800 mb-5 flex items-center"><span class="text-xl mr-2 text-blue-500">✈️</span> 航班資訊</h3>
                    
                    <div id="flight-display" class="space-y-4">
                        <!-- Outbound -->
                        <div class="bg-blue-50/50 rounded-2xl p-4 border border-blue-100">
                            <span class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded text-center mb-3 inline-block">去程</span>
                            <div class="grid grid-cols-[80px_1fr] gap-y-2 text-sm">
                                <div class="text-slate-500">日期/航班</div><div class="font-medium text-slate-800" id="flight-out-date"></div>
                                <div class="col-span-2 border-t border-blue-100/50 my-1 border-dashed"></div>
                                <div class="text-slate-500">路線</div>
                                <div class="font-medium text-slate-800">
                                    <span class="cursor-pointer hover:text-blue-600 border-b border-dashed border-blue-300" onclick="window.open('https://www.google.com/maps/search/TPE+Airport', '_blank')" title="開啟機場地圖">TPE (桃園)</span> ➔ 
                                    <span class="cursor-pointer hover:text-blue-600 border-b border-dashed border-blue-300" onclick="window.open('https://www.google.com/maps/search/CDG+Airport', '_blank')" title="開啟機場地圖">CDG (戴高樂)</span>
                                </div>
                                <div class="col-span-2 border-t border-blue-100/50 my-1 border-dashed"></div>
                                <div class="text-slate-500">起飛</div><div class="font-medium text-slate-800" id="flight-out-dept"></div>
                                <div class="text-slate-500">抵達</div><div class="font-medium text-slate-800" id="flight-out-arr"></div>
                            </div>
                            <button onclick="searchFlightStatus('out')" class="mt-3 w-full bg-white border border-blue-200 text-blue-600 text-xs font-bold py-2 rounded-xl hover:bg-blue-50 transition-colors">🔎 追蹤航班動態</button>
                        </div>
                        
                        <!-- Inbound -->
                        <div class="bg-blue-50/50 rounded-2xl p-4 border border-blue-100">
                            <span class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded text-center mb-3 inline-block">回程</span>
                            <div class="grid grid-cols-[80px_1fr] gap-y-2 text-sm">
                                <div class="text-slate-500">日期/航班</div><div class="font-medium text-slate-800" id="flight-in-date"></div>
                                <div class="col-span-2 border-t border-blue-100/50 my-1 border-dashed"></div>
                                <div class="text-slate-500">路線</div>
                                <div class="font-medium text-slate-800">
                                    <span class="cursor-pointer hover:text-blue-600 border-b border-dashed border-blue-300" onclick="window.open('https://www.google.com/maps/search/CDG+Airport', '_blank')" title="開啟機場地圖">CDG (戴高樂)</span> ➔ 
                                    <span class="cursor-pointer hover:text-blue-600 border-b border-dashed border-blue-300" onclick="window.open('https://www.google.com/maps/search/TPE+Airport', '_blank')" title="開啟機場地圖">TPE (桃園)</span>
                                </div>
                                <div class="col-span-2 border-t border-blue-100/50 my-1 border-dashed"></div>
                                <div class="text-slate-500">起飛</div><div class="font-medium text-slate-800" id="flight-in-dept"></div>
                                <div class="text-slate-500">抵達</div><div class="font-medium text-slate-800" id="flight-in-arr"></div>
                            </div>
                            <button onclick="searchFlightStatus('in')" class="mt-3 w-full bg-white border border-blue-200 text-blue-600 text-xs font-bold py-2 rounded-xl hover:bg-blue-50 transition-colors">🔎 追蹤航班動態</button>
                        </div>
                    </div>
                </div>
                
                <!-- Accommodation Info -->
                <div class="bg-white rounded-3xl p-6 shadow-sm">
                    <div class="flex justify-between items-center mb-5">
                        <h3 class="font-black text-lg text-slate-800 flex items-center"><span class="text-xl mr-2 text-amber-500">🏨</span> 住宿一覽</h3>
                        <button onclick="addHotel()" class="text-xs bg-amber-50 text-amber-600 hover:bg-amber-100 px-3 py-1.5 rounded-lg font-bold transition-colors">➕ 新增住宿</button>
                    </div>
                    <div id="hotel-list" class="space-y-4">
                        <!-- Hotels generated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab: Tickets (門票交通) -->
        <div id="view-tickets" class="hidden space-y-6">
            <div class="bg-white rounded-3xl p-6 shadow-sm">
                <div class="flex justify-between items-end mb-4 border-b border-slate-100 pb-4">
                    <h3 class="font-bold text-lg text-slate-800 flex items-center"><span class="mr-2">🎟️</span> 票券與交通待辦</h3>
                    <span id="ticket-count" class="text-xs font-bold bg-amber-100 text-amber-700 px-3 py-1 rounded-full">共 0 項</span>
                </div>
                
                <div id="ticket-list" class="space-y-3 mb-4">
                    <!-- Ticket items -->
                </div>
                
                <div class="flex space-x-2">
                    <input type="text" id="new-ticket-input" class="flex-1 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 transition-colors text-sm" placeholder="新增門票或交通卡...">
                    <button onclick="addTicket()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-6 rounded-xl transition-colors">新增</button>
                </div>
            </div>
        </div>

        <!-- Tab: Packing List (行李清單) -->
        <div id="view-packing" class="hidden space-y-6">
            <div class="bg-white rounded-3xl p-6 shadow-sm">
                <div class="flex justify-between items-end mb-4 border-b border-slate-100 pb-4">
                    <h3 class="font-bold text-lg text-slate-800 flex items-center"><span class="mr-2">🎒</span> 行前準備 / 行李清單</h3>
                    <span id="packing-progress" class="text-xs font-bold bg-blue-100 text-blue-700 px-3 py-1 rounded-full">0/0 完成</span>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 rounded-full h-2 mb-6 overflow-hidden">
                    <div id="packing-progress-bar" class="bg-emerald-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>

                <div id="packing-list" class="space-y-2 mb-6">
                    <!-- Packing items -->
                </div>
                
                <div class="flex space-x-2">
                    <input type="text" id="new-packing-input" class="flex-1 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 transition-colors text-sm" placeholder="新增清單項目...">
                    <button onclick="addPackingItem()" class="bg-indigo-700 hover:bg-indigo-600 text-white font-bold px-6 rounded-xl transition-colors">新增</button>
                </div>
            </div>
        </div>

        <!-- Tab: Budget (預算) -->
        <div id="view-budget" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Currency & Total -->
                <div class="bg-white rounded-3xl p-6 shadow-sm flex flex-col justify-center">
                    <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                        <h3 class="font-bold text-slate-800 flex items-center"><span class="mr-2 text-xl">💱</span> 匯率設定</h3>
                        <div class="text-sm bg-slate-100 rounded-lg p-1 flex">
                            <button onclick="setBaseCurrency('EUR')" id="btn-curr-EUR" class="px-3 py-1.5 rounded-md font-bold text-blue-700 bg-white shadow-sm transition-all">歐元 EUR</button>
                            <button onclick="setBaseCurrency('JPY')" id="btn-curr-JPY" class="px-3 py-1.5 rounded-md font-bold text-slate-500 hover:text-slate-700 transition-all">日圓 JPY</button>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-4 mb-8">
                        <div class="text-slate-500 font-medium">1 外幣 =</div>
                        <input type="number" id="exchange-rate" onchange="calculateBudget()" class="w-24 border border-slate-300 rounded-xl px-3 py-2 text-lg font-bold text-center outline-none focus:border-blue-500 bg-slate-50">
                        <div class="text-slate-500 font-medium">TWD</div>
                    </div>
                    
                    <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-2xl p-6 text-white shadow-lg shadow-indigo-200">
                        <p class="text-indigo-100 text-sm font-medium mb-1">預估總花費 (TWD)</p>
                        <div class="text-4xl font-black font-mono tracking-tight" id="total-budget">NT$ 0</div>
                        <div class="mt-3 text-xs text-indigo-200 bg-black/10 inline-block px-2 py-1 rounded">※ 包含行程內標註金額與門票代辦總和</div>
                    </div>
                </div>
                
                <!-- Category Breakdown -->
                <div class="bg-white rounded-3xl p-6 shadow-sm">
                    <h3 class="font-bold text-slate-800 mb-5 flex items-center border-b border-slate-100 pb-4"><span class="mr-2 text-xl">📊</span> 分類花費</h3>
                    <div class="space-y-5">
                        <div>
                            <div class="flex justify-between text-sm mb-1.5"><span class="text-slate-500 font-medium">行程/餐飲花費</span><span class="font-bold text-slate-800 font-mono" id="budget-itinerary">NT$ 0</span></div>
                            <div class="w-full bg-slate-100 rounded-full h-2"><div class="bg-blue-500 h-2 rounded-full" style="width: 50%"></div></div>
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-1.5"><span class="text-slate-500 font-medium">票券/交通代辦</span><span class="font-bold text-slate-800 font-mono" id="budget-tickets">NT$ 0</span></div>
                            <div class="w-full bg-slate-100 rounded-full h-2"><div class="bg-amber-400 h-2 rounded-full" style="width: 30%"></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Add/Edit Modal (Bottom-Sheet Style) -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex items-end justify-center sm:items-center sm:p-4 transition-opacity duration-300 opacity-0">
        <div id="modal-content" class="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto transform transition-transform duration-300 translate-y-full relative flex flex-col">
            
            <!-- Mobile Drag Handle -->
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-2 sm:hidden flex-shrink-0"></div>

            <div class="flex justify-between items-start mb-2 flex-shrink-0">
                <div>
                    <h3 id="modal-title" class="font-black text-2xl text-slate-800">編輯行程項目</h3>
                    <div id="modal-subtitle" class="text-amber-600 font-bold text-sm mt-1 hidden">🎭 10:30-11:30</div>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-3xl font-bold px-2 leading-none bg-slate-50 hover:bg-slate-100 rounded-full w-10 h-10 flex items-center justify-center transition-colors">&times;</button>
            </div>
            
            <input type="hidden" id="modal-edit-index" value="-1">
            
            <div class="space-y-4 text-sm pb-2 overflow-y-auto hide-scrollbar">
                <div>
                    <label class="block text-slate-500 font-bold mb-1.5 text-xs tracking-wider">⏰ 時間</label>
                    <input type="text" id="modal-time" class="w-full border border-slate-200 rounded-2xl p-3.5 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all text-base font-medium text-slate-700 bg-slate-50 focus:bg-white" placeholder="10:30-11:30">
                </div>
                
                <div>
                    <label class="block text-slate-500 font-bold mb-1.5 text-xs tracking-wider">標題 / 名稱</label>
                    <input type="text" id="modal-item-title" class="w-full border border-slate-200 rounded-2xl p-3.5 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all text-base font-bold text-slate-800 bg-slate-50 focus:bg-white" placeholder="巴黎歌劇院 Palais Garnier">
                </div>
                
                <div>
                    <label class="block text-slate-500 font-bold mb-1.5 text-xs tracking-wider">備註</label>
                    <textarea id="modal-desc" class="w-full border border-slate-200 rounded-2xl p-3.5 outline-none h-20 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all text-sm text-slate-600 bg-slate-50 focus:bg-white resize-none" placeholder="若進內部參觀請預留時間..."></textarea>
                </div>

                <div>
                    <label class="block text-amber-600 font-bold mb-1.5 text-xs tracking-wider flex items-center"><span class="mr-1 text-base">🌟</span> 必看 / 必吃 / 小提醒</label>
                    <textarea id="modal-tips" class="w-full border border-amber-200 bg-amber-50 rounded-2xl p-3.5 outline-none h-20 focus:border-amber-500 focus:ring-4 focus:ring-amber-500/20 transition-all text-sm text-amber-900 resize-none placeholder-amber-300" placeholder="例如：必點可麗露、記得預約時段..."></textarea>
                </div>

                <div>
                    <label class="block text-slate-500 font-bold mb-1.5 text-xs tracking-wider flex items-center"><span class="mr-1 text-base">🗺️</span> 地圖關鍵字</label>
                    <input type="text" id="modal-map-key" class="w-full border border-slate-200 rounded-2xl p-3.5 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all text-base text-slate-700 bg-slate-50 focus:bg-white font-mono" placeholder="Palais Garnier Paris">
                    <p class="text-[11px] text-slate-400 mt-1.5 ml-1">用於產生精準的地圖搜尋與路線導航連結。</p>
                </div>
                
                <div>
                    <label class="block text-slate-500 font-bold mb-1.5 text-xs tracking-wider flex items-center"><span class="mr-1 text-base">💰</span> 預估金額（當地或台幣皆可）</label>
                    <input type="number" id="modal-cost" class="w-full border border-slate-200 rounded-2xl p-3.5 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all text-lg font-bold text-slate-800 bg-slate-50 focus:bg-white" placeholder="0">
                </div>

                <div id="modal-move-day-container">
                    <label class="block text-slate-500 font-bold mb-1.5 text-xs tracking-wider flex items-center"><span class="mr-1 text-base">📅</span> 移動到哪一天</label>
                    <select id="modal-move-day" class="w-full border border-slate-200 rounded-2xl p-3.5 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all text-base font-bold text-slate-700 bg-slate-50 focus:bg-white cursor-pointer appearance-none">
                        <!-- Options generated by JS -->

        let gasUrl = localStorage.getItem('gasUrl') || "";
        
        function initApp() {
            const savedData = localStorage.getItem('multiTripData');
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    appData = parsed;
                } catch(e) { console.error("Error loading data", e); }
            }
            
            ensureFullDataIntegrity();
            document.getElementById('gas-url').value = gasUrl;
            
            updateTripSelector();
            renderAll();
        }

        // 確保資料完整性的強制修復機制
        function ensureFullDataIntegrity() {
            const currentTrip = getCurrentTrip();
            const defaultTrip = presetTemplates.paris;

            if (currentTrip.id === 'paris') {
                // 如果天數少於 7 天，強制補齊完整 7 天行程
                if (!currentTrip.days || currentTrip.days.length < 7) {
                    currentTrip.days = JSON.parse(JSON.stringify(defaultTrip.days));
                }
                // 如果門票少於 9 項，強制補齊
                if (!currentTrip.tickets || currentTrip.tickets.length < 9) {
                    currentTrip.tickets = JSON.parse(JSON.stringify(defaultTrip.tickets));
                }
                // 如果行李清單少於 11 項，強制補齊
                if (!currentTrip.packing || currentTrip.packing.length < 11) {
                    currentTrip.packing = JSON.parse(JSON.stringify(defaultTrip.packing));
                }
                if (!currentTrip.flight) currentTrip.flight = JSON.parse(JSON.stringify(defaultTrip.flight));
                if (!currentTrip.hotels || currentTrip.hotels.length === 0) currentTrip.hotels = JSON.parse(JSON.stringify(defaultTrip.hotels));
            }
        }

        function updateTripSelector() {
            // Simplified for this version, assumes only 'paris' exists
        }

        function getCurrentTrip() {
            if (!appData.trips[appData.activeTripId]) {
                appData.activeTripId = Object.keys(appData.trips)[0];
            }
            return appData.trips[appData.activeTripId];
        }

        function recordStateForUndo() {
            historyStack.push(JSON.stringify(appData));
            if (historyStack.length > 20) historyStack.shift();
        }

        function undo() {
            if (historyStack.length > 0) {
                const prevState = historyStack.pop();
                appData = JSON.parse(prevState);
                saveLocal();
                renderAll();
                showNotification("↩️ 已復原上一步");
            } else {
                showNotification("沒有可以復原的步驟了", "warning");
            }
        }

        function saveLocal() {
            localStorage.setItem('multiTripData', JSON.stringify(appData));
        }

        function renderAll() {
            renderDayTabs();
            renderTimeline();
            renderAccommodation();
            renderTickets();
            renderPacking();
            renderBudget();
        }

        function switchTab(tabId) {
            ['itinerary', 'accommodation', 'tickets', 'packing', 'budget'].forEach(id => {
                document.getElementById('view-' + id).classList.add('hidden');
                document.getElementById('tab-' + id).classList.remove('tab-active');
                document.getElementById('tab-' + id).classList.add('tab-inactive');
            });
            document.getElementById('view-' + tabId).classList.remove('hidden');
            document.getElementById('tab-' + tabId).classList.add('tab-active');
            document.getElementById('tab-' + tabId).classList.remove('tab-inactive');
        }

        // ITINERARY
        function renderDayTabs() {
            const container = document.getElementById('day-tabs');
            container.innerHTML = '';
            const trip = getCurrentTrip();
            
            trip.days.forEach((day, index) => {
                const isActive = index === (trip.activeDayIndex || 0);
                const btn = document.createElement('button');
                btn.className = `min-w-[70px] py-2 px-3 rounded-2xl flex flex-col items-center justify-center transition-all ${isActive ? 'bg-indigo-800 text-white shadow-md transform scale-105' : 'bg-white text-slate-500 hover:bg-slate-50 border border-slate-100'}`;
                btn.innerHTML = `<span class="text-xs font-bold mb-1">${day.label}</span><span class="${isActive ? 'text-lg font-black' : 'text-sm font-bold'}">${day.date}</span>`;
                btn.onclick = () => {
                    trip.activeDayIndex = index;
                    saveLocal();
                    renderDayTabs();
                    renderTimeline();
                };
                container.appendChild(btn);
            });
        }

        let draggedItemIndex = null;
        
        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            const trip = getCurrentTrip();
            const dayIndex = trip.activeDayIndex || 0;
            const currentDay = trip.days[dayIndex];
            
            if (!currentDay) return;

            document.getElementById('day-title').textContent = currentDay.subtitle || `Day ${dayIndex + 1}`;
            document.getElementById('day-subtitle').textContent = currentDay.desc || "";

            currentDay.items.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = "relative mb-8 last:mb-0 group cursor-move";
                itemEl.draggable = true;
                
                // Drag Events
                itemEl.addEventListener('dragstart', (e) => {
                    draggedItemIndex = index;
                    setTimeout(() => itemEl.classList.add('opacity-40'), 0);
                    e.dataTransfer.effectAllowed = 'move';
                });
                itemEl.addEventListener('dragend', () => {
                    draggedItemIndex = null;
                    itemEl.classList.remove('opacity-40');
                    document.querySelectorAll('.drop-zone').forEach(el => el.classList.remove('drop-zone'));
                });
                itemEl.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if(draggedItemIndex === index) return;
                    itemEl.classList.add('drop-zone');
                });
                itemEl.addEventListener('dragleave', () => {
                    itemEl.classList.remove('drop-zone');
                });
                itemEl.addEventListener('drop', (e) => {
                    e.preventDefault();
                    itemEl.classList.remove('drop-zone');
                    if (draggedItemIndex !== null && draggedItemIndex !== index) {
                        recordStateForUndo();
                        const items = currentDay.items;
                        const draggedItem = items.splice(draggedItemIndex, 1)[0];
                        items.splice(index, 0, draggedItem);
                        saveLocal();
                        renderTimeline();
                        renderBudget();
                    }
                });

                let htmlStr = `
                    <div class="absolute -left-[9px] top-6 w-4 h-4 rounded-full border-[4px] border-white bg-indigo-500 shadow-sm z-10 transition-transform group-hover:scale-125"></div>
                    <div class="absolute -left-[75px] top-5 w-[60px] text-right text-[14px] font-black text-amber-600 tracking-tight">${item.time || ''}</div>
                    
                    <div class="ml-2 sm:ml-6 bg-white border border-slate-100 p-4 sm:p-5 rounded-3xl shadow-sm hover:shadow-md transition-all relative flex flex-col sm:flex-row gap-4 sm:items-start group-hover:border-indigo-100">
                        
                        <div class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-full pr-2 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex text-slate-300">
                            <span class="text-xl font-bold cursor-grab active:cursor-grabbing text-slate-300 hover:text-slate-500">⋮⋮</span>
                        </div>

                        <div class="flex-1 w-full">
                            <div class="flex justify-between items-start mb-1">
                                <h4 class="font-black text-slate-800 text-lg flex-1 pr-4 leading-tight">${item.title}</h4>
                                <div class="flex items-center space-x-1 sm:space-x-2 -mt-1 -mr-2 sm:mr-0 flex-shrink-0">
                                    <button onclick="editItem(${index})" class="text-slate-300 hover:text-blue-500 transition-colors p-2 rounded-lg hover:bg-slate-50" title="編輯">✏️</button>
                                    <button onclick="deleteItem(${index})" class="text-slate-300 hover:text-red-500 transition-colors p-2 rounded-lg hover:bg-slate-50" title="刪除">🗑️</button>
                                </div>
                            </div>
                `;

                if (item.desc) {
                    htmlStr += `<p class="text-sm text-slate-500 mt-2 whitespace-pre-line leading-relaxed">${item.desc}</p>`;
                }
                
                if (item.tips) {
                    htmlStr += `
                    <div class="mt-3 bg-amber-50/70 rounded-2xl p-3 border border-amber-100/50 relative overflow-hidden">
                        <div class="absolute -right-2 -top-2 text-4xl opacity-10">🌟</div>
                        <p class="text-sm text-amber-900 font-bold flex items-start leading-relaxed relative z-10">
                            <span class="mr-2 text-base shadow-sm">🌟</span>
                            <span>${item.tips.replace(/\n/g, '<br>')}</span>
                        </p>
                    </div>`;
                }
                
                htmlStr += `
                            <div class="flex flex-wrap items-center gap-2 mt-4 pt-3 border-t border-slate-50">
                                <button onclick="openMapSearch('${(item.mapKey || item.title).replace(/'/g, "\\'")}')" class="bg-indigo-50/80 hover:bg-indigo-100 text-indigo-700 text-[11px] font-black px-3 py-1.5 rounded-xl flex items-center transition-colors shadow-sm">
                                    📍 開啟地圖
                                </button>
                `;
                
                if (item.cost > 0) {
                    htmlStr += `<span class="bg-amber-50 text-amber-700 text-[11px] font-black px-3 py-1.5 rounded-xl flex items-center shadow-sm">💰 NT$${item.cost}</span>`;
                }
                
                htmlStr += `
                            </div>
                        </div>
                    </div>
                `;
                
                itemEl.innerHTML = htmlStr;
                container.appendChild(itemEl);
            });
        }

        function showAddModal() { 
            const trip = getCurrentTrip();
            document.getElementById('modal-title').textContent = '新增行程項目';
            document.getElementById('modal-subtitle').classList.add('hidden');
            document.getElementById('modal-move-day-container').classList.add('hidden');
            
            document.getElementById('modal-edit-index').value = -1;
            document.getElementById('modal-time').value = '';
            document.getElementById('modal-item-title').value = '';
            document.getElementById('modal-desc').value = '';
            document.getElementById('modal-tips').value = '';
            document.getElementById('modal-map-key').value = '';
            document.getElementById('modal-cost').value = '';
            openModal();
        }

        function editItem(idx) {
            const trip = getCurrentTrip();
            const currentDayIndex = trip.activeDayIndex || 0;
            const currentDay = trip.days[currentDayIndex];
            const item = currentDay.items[idx];
            
            document.getElementById('modal-title').textContent = '編輯行程項目';
            
            const subtitle = document.getElementById('modal-subtitle');
            subtitle.innerHTML = `🎭 ${item.time || '時間未定'}`;
            subtitle.classList.remove('hidden');
            
            document.getElementById('modal-move-day-container').classList.remove('hidden');
            
            const select = document.getElementById('modal-move-day');
            select.innerHTML = '';
            trip.days.forEach((day, i) => {
                const isCurrent = i === currentDayIndex;
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `${day.date} (${day.label}) — ${isCurrent ? '目前所在天' : '移動至此'}`;
                if (isCurrent) option.selected = true;
                select.appendChild(option);
            });

            document.getElementById('modal-edit-index').value = idx;
            document.getElementById('modal-time').value = item.time || '';
            document.getElementById('modal-item-title').value = item.title || '';
            document.getElementById('modal-desc').value = item.desc || '';
            document.getElementById('modal-tips').value = item.tips || '';
            document.getElementById('modal-map-key').value = item.mapKey || '';
            document.getElementById('modal-cost').value = item.cost || 0;
            
            openModal();
        }

        function openModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            content.classList.remove('translate-y-full');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
        
        function saveModalItem() {
            recordStateForUndo();
            const editIndex = parseInt(document.getElementById('modal-edit-index').value);
            
            const trip = getCurrentTrip();
            const currentDayIndex = trip.activeDayIndex || 0;
            const currentDay = trip.days[currentDayIndex];
            
            const newItemData = {
                time: document.getElementById('modal-time').value || "隨時",
                title: document.getElementById('modal-item-title').value || "新項目",
                desc: document.getElementById('modal-desc').value || "",
                tips: document.getElementById('modal-tips').value || "",
                mapKey: document.getElementById('modal-map-key').value || "",
                cost: Number(document.getElementById('modal-cost').value || 0)
            };

            if (editIndex > -1) {
                const moveDaySelect = document.getElementById('modal-move-day');
                const targetDayIndex = parseInt(moveDaySelect.value);
                
                if (targetDayIndex !== currentDayIndex && targetDayIndex >= 0 && targetDayIndex < trip.days.length) {
                    currentDay.items.splice(editIndex, 1);
                    trip.days[targetDayIndex].items.push(newItemData);
                    trip.days[targetDayIndex].items.sort((a,b) => (a.time||"").localeCompare(b.time||""));
                    showNotification(`已將行程移至 ${trip.days[targetDayIndex].date}`);
                } else {
                    currentDay.items[editIndex] = newItemData;
                }
            } else {
                currentDay.items.push(newItemData);
                currentDay.items.sort((a,b) => (a.time||"").localeCompare(b.time||""));
            }
            
            saveLocal(); 
            closeModal(); 
            renderTimeline(); 
            renderBudget();
        }

        function deleteItem(idx) {
            if(confirm('確定要刪除這個行程項目嗎？')) {
                recordStateForUndo();
                getCurrentTrip().days[getCurrentTrip().activeDayIndex || 0].items.splice(idx, 1);
                saveLocal(); renderTimeline(); renderBudget();
            }
        }

        function renderAccommodation() {
            const trip = getCurrentTrip();
            if(!trip.flight) trip.flight = presetTemplates.paris.flight;
            if(!trip.hotels) trip.hotels = presetTemplates.paris.hotels;

            // Flight
            document.getElementById('flight-out-date').textContent = trip.flight.outbound.date + " " + trip.flight.outbound.no;
            document.getElementById('flight-out-dept').textContent = trip.flight.outbound.dept;
            document.getElementById('flight-out-arr').textContent = trip.flight.outbound.arr;
            
            document.getElementById('flight-in-date').textContent = trip.flight.inbound.date + " " + trip.flight.inbound.no;
            document.getElementById('flight-in-dept').textContent = trip.flight.inbound.dept;
            document.getElementById('flight-in-arr').textContent = trip.flight.inbound.arr;

            // Hotels
            const hotelList = document.getElementById('hotel-list');
            hotelList.innerHTML = '';
            trip.hotels.forEach((hotel, idx) => {
                hotelList.innerHTML += `
                    <div class="bg-amber-50/50 rounded-2xl p-4 border border-amber-100 group relative">
                        <button onclick="editHotel(${idx})" class="absolute top-4 right-12 text-slate-400 hover:text-blue-500 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity bg-white/50 p-1 rounded-md" title="編輯">✏️</button>
                        <button onclick="deleteHotel(${idx})" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity bg-white/50 p-1 rounded-md" title="刪除">🗑️</button>
                        <div class="font-black text-slate-800 text-lg mb-1 pr-16">${hotel.name}</div>
                        <div class="text-sm text-slate-500 mb-3">📅 ${hotel.date}</div>
                        <div class="text-xs text-slate-600 mb-3 whitespace-pre-wrap">${hotel.address}</div>
                        <button onclick="openMapSearch('${hotel.address.replace(/'/g, "\\'")}')" class="bg-white border border-amber-200 text-amber-700 text-xs font-bold px-3 py-2 rounded-xl flex items-center hover:bg-amber-100 transition-colors shadow-sm inline-flex w-auto">
                            📍 開啟地圖導航
                        </button>
                    </div>
                `;
            });
        }
        
        function editFlightInfo() {
            const trip = getCurrentTrip();
            const newOut = prompt("編輯去程 (格式：日期 航班號碼|起飛時間|抵達時間)", `${trip.flight.outbound.date} ${trip.flight.outbound.no}|${trip.flight.outbound.dept}|${trip.flight.outbound.arr}`);
            if(newOut) {
                let parts = newOut.split('|');
                if(parts.length===3) {
                    let d = parts[0].split(' ');
                    trip.flight.outbound = { date: d[0], no: d.slice(1).join(' '), route: trip.flight.outbound.route, dept: parts[1], arr: parts[2] };
                }
            }
            const newIn = prompt("編輯回程 (格式：日期 航班號碼|起飛時間|抵達時間)", `${trip.flight.inbound.date} ${trip.flight.inbound.no}|${trip.flight.inbound.dept}|${trip.flight.inbound.arr}`);
            if(newIn) {
                let parts = newIn.split('|');
                if(parts.length===3) {
                    let d = parts[0].split(' ');
                    trip.flight.inbound = { date: d[0], no: d.slice(1).join(' '), route: trip.flight.inbound.route, dept: parts[1], arr: parts[2] };
                }
            }
            saveLocal(); renderAccommodation();
        }

        function addHotel() {
            const name = prompt("飯店名稱:");
            if(!name) return;
            const date = prompt("住宿日期/天數 (例: 2/4~2/6 3晚):");
            const addr = prompt("飯店詳細地址:");
            getCurrentTrip().hotels.push({name, date, address: addr});
            saveLocal(); renderAccommodation();
        }

        function editHotel(idx) {
            const trip = getCurrentTrip();
            const hotel = trip.hotels[idx];
            const name = prompt("編輯飯店名稱:", hotel.name);
            if(name === null) return;
            const date = prompt("編輯住宿日期/天數:", hotel.date);
            const addr = prompt("編輯飯店地址:", hotel.address);
            
            trip.hotels[idx] = { name: name || hotel.name, date: date || hotel.date, address: addr || hotel.address };
            saveLocal(); renderAccommodation();
        }

        function deleteHotel(idx) {
            if(confirm('確定要刪除這筆住宿資訊嗎？')) {
                getCurrentTrip().hotels.splice(idx,1);
                saveLocal(); renderAccommodation();
            }
        }
        
        function searchFlightStatus(type) {
            const trip = getCurrentTrip();
            const flightNo = type === 'out' ? trip.flight.outbound.no : trip.flight.inbound.no;
            window.open(`https://www.google.com/search?q=flight+status+${flightNo.replace(/\s/g, '')}`, '_blank');
        }

        function renderTickets() {
            const container = document.getElementById('ticket-list');
            container.innerHTML = '';
            const tickets = getCurrentTrip().tickets || [];
            document.getElementById('ticket-count').textContent = `共 ${tickets.length} 項`;
            
            tickets.forEach((t, i) => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100 hover:bg-white hover:shadow-sm transition-all group">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <input type="checkbox" ${t.done?'checked':''} onchange="toggleTicket(${i})" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer flex-shrink-0">
                            <span class="${t.done?'line-through text-slate-400':'text-slate-700 font-bold'} truncate text-sm sm:text-base cursor-pointer" onclick="editTicket(${i})">${t.name}</span>
                        </div>
                        <div class="flex items-center space-x-3 flex-shrink-0">
                            <span class="text-xs sm:text-sm font-bold bg-amber-100 text-amber-700 px-2 py-1 rounded-lg">NT$ ${t.cost}</span>
                            <button onclick="deleteTicket(${i})" class="text-slate-300 hover:text-red-500 transition-colors p-1">🗑️</button>
                        </div>
                    </div>`;
            });
        }
        function toggleTicket(i) { getCurrentTrip().tickets[i].done = !getCurrentTrip().tickets[i].done; saveLocal(); renderTickets(); }
        function addTicket() {
            const inp = document.getElementById('new-ticket-input');
            if(inp.value.trim()){
                getCurrentTrip().tickets.push({name: inp.value.trim(), cost: 0, done: false});
                inp.value = ''; saveLocal(); renderTickets(); renderBudget();
            }
        }
        function editTicket(i) {
            const t = getCurrentTrip().tickets[i];
            const newName = prompt('修改項目名稱', t.name);
            if(newName) t.name = newName;
            const newCost = prompt('修改金額 (NT$)', t.cost);
            if(newCost !== null) t.cost = Number(newCost)||0;
            saveLocal(); renderTickets(); renderBudget();
        }
        function deleteTicket(i) { if(confirm('刪除項目？')) { getCurrentTrip().tickets.splice(i,1); saveLocal(); renderTickets(); renderBudget(); } }

        function renderPacking() {
            const container = document.getElementById('packing-list');
            container.innerHTML = '';
            const packing = getCurrentTrip().packing || [];
            const doneCount = packing.filter(p=>p.done).length;
            
            document.getElementById('packing-progress').textContent = `${doneCount}/${packing.length} 完成`;
            const pct = packing.length ? (doneCount/packing.length)*100 : 0;
            document.getElementById('packing-progress-bar').style.width = `${pct}%`;
            
            packing.forEach((p, i) => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100 hover:bg-white hover:shadow-sm transition-all group">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" ${p.done?'checked':''} onchange="togglePacking(${i})" class="w-5 h-5 rounded border-slate-300 text-emerald-500 focus:ring-emerald-500 cursor-pointer">
                            <span class="${p.done?'line-through text-slate-400':'text-slate-700 font-bold'} text-sm sm:text-base">${p.name}</span>
                        </div>
                        <button onclick="deletePacking(${i})" class="text-slate-300 hover:text-red-500 transition-colors p-1">🗑️</button>
                    </div>`;
            });
        }
        function togglePacking(i) { getCurrentTrip().packing[i].done = !getCurrentTrip().packing[i].done; saveLocal(); renderPacking(); }
        function addPackingItem() {
            const inp = document.getElementById('new-packing-input');
            if(inp.value.trim()){
                getCurrentTrip().packing.push({name: inp.value.trim(), done: false});
                inp.value = ''; saveLocal(); renderPacking();
            }
        }
        function deletePacking(i) { if(confirm('刪除項目？')) { getCurrentTrip().packing.splice(i,1); saveLocal(); renderPacking(); } }

        // BUDGET
        function setBaseCurrency(currency) {
            const trip = getCurrentTrip();
            trip.baseCurrency = currency;
            if(currency === 'EUR') trip.exchangeRate = 34.5;
            if(currency === 'JPY') trip.exchangeRate = 0.21;
            document.getElementById('exchange-rate').value = trip.exchangeRate;
            saveLocal();
            renderBudget();
        }

        function calculateBudget() {
            const trip = getCurrentTrip();
            trip.exchangeRate = Number(document.getElementById('exchange-rate').value) || 1;
            saveLocal();
            renderBudget();
        }

        function renderBudget() {
            const trip = getCurrentTrip();
            document.getElementById('exchange-rate').value = trip.exchangeRate || 1;
            
            ['EUR', 'JPY'].forEach(c => {
                const btn = document.getElementById('btn-curr-'+c);
                if(trip.baseCurrency === c) {
                    btn.className = 'px-3 py-1.5 rounded-md font-bold text-blue-700 bg-white shadow-sm transition-all';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-md font-bold text-slate-500 hover:text-slate-700 transition-all';
                }
            });

            let itineraryTotal = 0;
            trip.days.forEach(day => {
                day.items.forEach(item => { itineraryTotal += (Number(item.cost) || 0); });
            });

            let ticketTotal = 0;
            if(trip.tickets) {
                trip.tickets.forEach(t => { ticketTotal += (Number(t.cost) || 0); });
            }

            const total = itineraryTotal + ticketTotal;

            document.getElementById('budget-itinerary').textContent = `NT$ ${itineraryTotal.toLocaleString()}`;
            document.getElementById('budget-tickets').textContent = `NT$ ${ticketTotal.toLocaleString()}`;
            document.getElementById('total-budget').textContent = `NT$ ${total.toLocaleString()}`;
        }

        function openMapSearch(keyword) {
            const cleanKeyword = keyword.replace(/[\u1000-\uFFFF]+/g, '').trim();
            window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanKeyword)}`, '_blank');
        }

        function openDailyRouteMap() {
            const trip = getCurrentTrip();
            const currentDay = trip.days[trip.activeDayIndex || 0];
            if (!currentDay || !currentDay.items || currentDay.items.length === 0) {
                showNotification('今日尚無行程，無法產生路線！', 'error');
                return;
            }
            const waypoints = currentDay.items.map(item => encodeURIComponent((item.mapKey || item.title).replace(/[\u1000-\uFFFF]+/g, '').trim()));
            if (waypoints.length === 1) {
                window.open(`https://www.google.com/maps/search/?api=1&query=${waypoints[0]}`, '_blank');
                return;
            }
            const origin = waypoints.shift();
            const destination = waypoints.pop() || origin;
            let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;
            if (waypoints.length > 0) {
                url += `&waypoints=${waypoints.join('|')}`;
            }
            window.open(url, '_blank');
        }

        function showNotification(msg, type='success') {
            const div = document.createElement('div');
            div.className = `fixed bottom-24 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl text-white font-bold text-sm z-[200] transition-all duration-300 translate-y-10 opacity-0 ${type==='success'?'bg-emerald-600':'bg-red-600'}`;
            div.textContent = msg;
            document.body.appendChild(div);
            
            setTimeout(() => {
                div.classList.remove('translate-y-10', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                div.classList.add('translate-y-10', 'opacity-0');
                setTimeout(()=>div.remove(), 300);
            }, 2500);
        }

        function saveGasUrl() {
            gasUrl = document.getElementById('gas-url').value.trim();
            localStorage.setItem('gasUrl', gasUrl);
            showNotification('雲端網址已儲存！');
        }

        async function syncWithCloud() {
            if (!gasUrl) {
                showNotification('請先輸入並儲存 GAS 雲端網址！', 'error');
                return;
            }
            const statusEl = document.getElementById('sync-status');
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-400 animate-ping mr-1.5"></span><span class="text-yellow-400">同步傳輸中...</span>`;
            
            try {
                const response = await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(appData)
                });
                
                setTimeout(() => {
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse mr-1.5"></span><span class="text-emerald-400 font-bold">🟢 雲端已同步</span>`;
                    showNotification("已成功同步最新資料至雲端！");
                }, 1000);
                
            } catch (error) {
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-1.5"></span><span class="text-red-400">同步失敗</span>`;
                showNotification("同步失敗，請檢查網址與網路狀態", "error");
            }
        }

        // Initialize on load
        window.onload = initApp;
    </script>
</body>
</html>

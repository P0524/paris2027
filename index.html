<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旅遊行程</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f8fafc;
            overscroll-behavior-y: none;
        }

        .tab-active { background-color: #e0e7ff; color: #4338ca; font-weight: bold; border: 2px solid #312e81; }
        .tab-inactive { background-color: white; color: #64748b; font-weight: normal; border: 2px solid transparent; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Smooth Drag and Drop animations with dashed indicator and touch lock */
        .draggable-card {
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1), opacity 0.2s ease;
            touch-action: pan-y;
        }
        .dragging-active {
            opacity: 0.9;
            transform: scale(1.03) rotate(1deg);
            box-shadow: 0 25px 30px -5px rgb(0 0 0 / 0.25), 0 10px 15px -5px rgb(0 0 0 / 0.1);
            z-index: 100;
            background-color: #ffffff;
            border: 2px dashed #6366f1 !important;
            touch-action: none;
        }
        .drop-target-indicator {
            border-top: 3px dashed #6366f1 !important;
            padding-top: 1.25rem !important;
            transition: all 0.2s ease;
            background-color: rgba(99, 102, 241, 0.04);
            border-radius: 1rem;
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 pb-24 w-full">

    <header class="bg-indigo-900 text-white p-4 shadow-lg sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex flex-col space-y-3 w-full">
            <div class="flex justify-between items-center w-full">
                <div class="flex items-center space-x-3 flex-1 min-w-0">
                    <span class="bg-amber-400 text-indigo-900 font-extrabold px-2 py-1 rounded text-sm flex-shrink-0">FR</span>
                    <select id="trip-selector" onchange="switchTrip()" class="bg-indigo-800/80 border border-indigo-700 text-white font-bold text-base sm:text-lg rounded-lg px-2 py-1 outline-none focus:ring-2 focus:ring-amber-400 cursor-pointer w-full max-w-[200px] truncate">
                        <option value="paris">巴黎 Bonjour 2027</option>
                    </select>
                </div>
                <div class="flex space-x-1.5 flex-shrink-0 ml-2">
                    <button onclick="createNewTrip()" class="bg-emerald-500 hover:bg-emerald-400 text-white text-[11px] sm:text-xs font-bold px-2 sm:px-3 py-1.5 rounded-lg shadow transition-colors flex items-center">
                        ➕ <span class="hidden sm:inline ml-1">新增/複製行程</span>
                    </button>
                    <button onclick="undo()" class="bg-indigo-700 hover:bg-indigo-600 text-white text-[11px] sm:text-xs font-bold px-2 sm:px-3 py-1.5 rounded-lg shadow transition-colors flex items-center" title="復原 (Ctrl+Z)">
                        ↩️ <span class="hidden sm:inline ml-1">復原</span>
                    </button>
                </div>
            </div>

            <div class="bg-indigo-950/50 p-2.5 rounded-xl border border-indigo-800/50 flex flex-col sm:flex-row gap-2 items-center justify-between text-sm w-full">
                <div class="flex items-center space-x-2 w-full sm:flex-1">
                    <span class="text-indigo-200 text-xs whitespace-nowrap hidden sm:inline">🟩 GAS 雲端網址:</span>
                    <span class="text-indigo-200 text-xs whitespace-nowrap sm:hidden">GAS:</span>
                    <input type="text" id="gas-url" placeholder="https://script.google.com/macros/s/.../exec" class="w-full sm:flex-1 bg-indigo-900 border border-indigo-700 rounded px-2 py-1 text-xs text-indigo-100 outline-none focus:border-indigo-400 font-mono">
                    <button onclick="saveGasUrl()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs transition-colors whitespace-nowrap flex-shrink-0">儲存</button>
                </div>
                <div class="flex space-x-2 w-full sm:w-auto justify-end">
                    <button onclick="syncWithCloud()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded-lg text-xs font-bold flex items-center shadow-md transition-all whitespace-nowrap">
                        🔄 同步 (Sync)
                    </button>
                    <span id="sync-status" class="bg-slate-800/80 px-2 py-1 rounded-full text-[11px] flex items-center text-slate-400 border border-slate-700 whitespace-nowrap">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-500 mr-1.5"></span> 尚未綁定雲端
                    </span>
                </div>
            </div>
        </div>
    </header>

    <nav class="max-w-4xl mx-auto mt-4 px-1 sm:px-4 w-full">
        <div class="bg-white rounded-2xl shadow-sm p-1.5 flex overflow-x-auto hide-scrollbar space-x-1.5 w-full">
            <button onclick="switchTab('itinerary')" id="tab-itinerary" class="tab-active flex-1 min-w-[90px] py-2.5 px-2 rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center space-x-1.5 whitespace-nowrap">
                <span class="text-base sm:text-lg">📅</span> <span class="font-bold">每日行程</span>
            </button>
            <button onclick="switchTab('accommodation')" id="tab-accommodation" class="tab-inactive flex-1 min-w-[90px] py-2.5 px-2 rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center space-x-1.5 whitespace-nowrap">
                <span class="text-base sm:text-lg">✈️</span> <span class="font-bold">航班住宿</span>
            </button>
            <button onclick="switchTab('tickets')" id="tab-tickets" class="tab-inactive flex-1 min-w-[90px] py-2.5 px-2 rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center space-x-1.5 whitespace-nowrap">
                <span class="text-base sm:text-lg">🎟️</span> <span class="font-bold">門票交通</span>
            </button>
            <button onclick="switchTab('packing')" id="tab-packing" class="tab-inactive flex-1 min-w-[90px] py-2.5 px-2 rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center space-x-1.5 whitespace-nowrap">
                <span class="text-base sm:text-lg">🎒</span> <span class="font-bold">行李清單</span>
            </button>
            <button onclick="switchTab('budget')" id="tab-budget" class="tab-inactive flex-1 min-w-[90px] py-2.5 px-2 rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center space-x-1.5 whitespace-nowrap">
                <span class="text-base sm:text-lg">💰</span> <span class="font-bold">預算</span>
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-6 px-1 sm:px-4 w-full">
        
        <div id="view-itinerary" class="space-y-6 w-full">
            <div id="day-tabs" class="flex overflow-x-auto space-x-2 pb-2 hide-scrollbar w-full px-0.5"></div>
            
            <div class="bg-white rounded-3xl px-3 sm:px-6 py-5 sm:p-8 shadow-sm w-full overflow-hidden">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-100 pb-6 w-full px-1 sm:px-0">
                    <div class="flex-1 w-full pl-1">
                        <h2 id="day-title" class="text-xl sm:text-2xl font-black text-slate-800 leading-tight"></h2>
                        <p id="day-subtitle" class="text-slate-500 text-xs sm:text-sm mt-1.5 leading-relaxed"></p>
                    </div>
                    <button onclick="openDailyRouteMap()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-3 sm:py-2.5 rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center justify-center space-x-2 whitespace-nowrap flex-shrink-0">
                        <span class="text-lg">🧭</span> <span>開啟今日路線導航</span>
                    </button>
                </div>
                
                <!-- Timeline container with safely separated time & vertical line -->
                <div id="timeline" class="relative pl-16 sm:pl-24 pb-6 space-y-4 mt-4 pr-1"></div>
                
                <div class="px-1 sm:px-0 mt-6">
                    <button onclick="showAddModal()" class="w-full py-4 border-2 border-dashed border-slate-200 text-slate-500 font-bold rounded-2xl hover:bg-slate-50 hover:border-slate-300 transition-all flex items-center justify-center space-x-2 group">
                        <span class="text-xl group-hover:scale-125 transition-transform">➕</span> <span>新增此日行程項目</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="view-accommodation" class="hidden space-y-6 w-full px-1 sm:px-0">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm relative group w-full">
                    <button onclick="editFlightInfo()" class="absolute top-4 right-4 text-slate-400 hover:text-blue-600 transition-colors bg-slate-50 p-2 rounded-lg shadow-sm border border-slate-100" title="編輯航班">✏️</button>
                    <h3 class="font-black text-lg text-slate-800 mb-5 flex items-center"><span class="text-xl mr-2">✈️</span> 航班資訊</h3>
                    
                    <div id="flight-display" class="space-y-4">
                        <div class="bg-blue-50/50 rounded-2xl p-4 border border-blue-100 relative">
                            <span class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded text-center mb-3 inline-block">去程</span>
                            <div class="grid grid-cols-[70px_1fr] sm:grid-cols-[80px_1fr] gap-y-2 text-xs sm:text-sm">
                                <div class="text-slate-500">日期/航班</div><div class="font-medium text-slate-800" id="flight-out-date"></div>
                                <div class="col-span-2 border-t border-blue-100/50 my-1 border-dashed"></div>
                                <div class="text-slate-500">路線</div><div class="font-medium text-slate-800">TPE (桃園) ➔ CDG (戴高樂)</div>
                                <div class="col-span-2 border-t border-blue-100/50 my-1 border-dashed"></div>
                                <div class="text-slate-500">起飛</div><div class="font-medium text-slate-800" id="flight-out-dept"></div>
                                <div class="text-slate-500">抵達</div><div class="font-medium text-slate-800" id="flight-out-arr"></div>
                            </div>
                        </div>
                        <div class="bg-blue-50/50 rounded-2xl p-4 border border-blue-100 relative">
                            <span class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded text-center mb-3 inline-block">回程</span>
                            <div class="grid grid-cols-[70px_1fr] sm:grid-cols-[80px_1fr] gap-y-2 text-xs sm:text-sm">
                                <div class="text-slate-500">日期/航班</div><div class="font-medium text-slate-800" id="flight-in-date"></div>
                                <div class="col-span-2 border-t border-blue-100/50 my-1 border-dashed"></div>
                                <div class="text-slate-500">路線</div><div class="font-medium text-slate-800">CDG (戴高樂) ➔ TPE (桃園)</div>
                                <div class="col-span-2 border-t border-blue-100/50 my-1 border-dashed"></div>
                                <div class="text-slate-500">起飛</div><div class="font-medium text-slate-800" id="flight-in-dept"></div>
                                <div class="text-slate-500">抵達</div><div class="font-medium text-slate-800" id="flight-in-arr"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm w-full">
                    <div class="flex justify-between items-center mb-5">
                        <h3 class="font-black text-lg text-slate-800 flex items-center"><span class="text-xl mr-2">🏨</span> 住宿一覽</h3>
                        <button onclick="addHotel()" class="text-[11px] sm:text-xs bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 px-3 py-1.5 rounded-lg font-bold transition-colors shadow-sm">➕ 新增住宿</button>
                    </div>
                    <div id="hotel-list" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <div id="view-tickets" class="hidden space-y-6 w-full px-1 sm:px-0">
            <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm w-full">
                <div class="flex justify-between items-end mb-4 border-b border-slate-100 pb-4">
                    <h3 class="font-bold text-lg text-slate-800 flex items-center"><span class="mr-2">🎟️</span> 票券與交通待辦</h3>
                    <span id="ticket-count" class="text-xs font-bold bg-amber-100 text-amber-700 px-3 py-1 rounded-full whitespace-nowrap">共 0 項</span>
                </div>
                <div id="ticket-list" class="space-y-3 mb-5 w-full"></div>
                <div class="flex space-x-2 w-full">
                    <input type="text" id="new-ticket-input" class="flex-1 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 text-sm w-full" placeholder="新增門票或交通卡...">
                    <button onclick="addTicket()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-4 sm:px-6 rounded-xl transition-colors whitespace-nowrap">新增</button>
                </div>
            </div>
        </div>

        <div id="view-packing" class="hidden space-y-6 w-full px-1 sm:px-0">
            <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm w-full">
                <div class="flex justify-between items-end mb-4 border-b border-slate-100 pb-4">
                    <h3 class="font-bold text-lg text-slate-800 flex items-center"><span class="mr-2">🎒</span> 行前準備 / 行李清單</h3>
                    <span id="packing-progress" class="text-xs font-bold bg-blue-100 text-blue-700 px-3 py-1 rounded-full whitespace-nowrap">0/0 完成</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2 mb-6 overflow-hidden">
                    <div id="packing-progress-bar" class="bg-emerald-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <div id="packing-list" class="space-y-2 mb-6 w-full"></div>
                <div class="flex space-x-2 w-full">
                    <input type="text" id="new-packing-input" class="flex-1 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 text-sm w-full" placeholder="新增清單項目...">
                    <button onclick="addPackingItem()" class="bg-indigo-700 hover:bg-indigo-600 text-white font-bold px-4 sm:px-6 rounded-xl transition-colors whitespace-nowrap">新增</button>
                </div>
            </div>
        </div>

        <div id="view-budget" class="hidden space-y-6 w-full px-1 sm:px-0">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm flex flex-col justify-center w-full">
                    <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                        <h3 class="font-bold text-slate-800 flex items-center"><span class="mr-2 text-xl">💰</span> 匯率設定</h3>
                        <div class="text-sm bg-slate-100 rounded-lg p-1 flex">
                            <button onclick="setBaseCurrency('EUR')" id="btn-curr-EUR" class="px-3 py-1.5 rounded-md font-bold text-blue-700 bg-white shadow-sm transition-all">歐元 EUR</button>
                            <button onclick="setBaseCurrency('JPY')" id="btn-curr-JPY" class="px-3 py-1.5 rounded-md font-bold text-slate-500 hover:text-slate-700 transition-all">日圓 JPY</button>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3 mb-8 w-full">
                        <div class="text-slate-500 font-medium whitespace-nowrap">1 外幣 =</div>
                        <input type="number" id="exchange-rate" onchange="calculateBudget()" class="w-20 sm:w-24 border border-slate-300 rounded-xl px-2 sm:px-3 py-2 text-base sm:text-lg font-bold text-center outline-none focus:border-blue-500 bg-slate-50">
                        <div class="text-slate-500 font-medium whitespace-nowrap">TWD</div>
                    </div>
                    <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-2xl p-5 sm:p-6 text-white shadow-lg shadow-indigo-200">
                        <p class="text-indigo-100 text-sm font-medium mb-1">預估總花費 (TWD)</p>
                        <div class="text-3xl sm:text-4xl font-black font-mono tracking-tight break-words" id="total-budget">NT$ 0</div>
                    </div>
                </div>
                <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm w-full">
                    <h3 class="font-bold text-slate-800 mb-5 flex items-center border-b border-slate-100 pb-4"><span class="mr-2 text-xl">📊</span> 分類花費</h3>
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between text-sm mb-1.5"><span class="text-slate-500 font-medium">行程/餐飲花費</span><span class="font-bold text-slate-800 font-mono" id="budget-itinerary">NT$ 0</span></div>
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-1.5"><span class="text-slate-500 font-medium">票券/交通代辦</span><span class="font-bold text-slate-800 font-mono" id="budget-tickets">NT$ 0</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex flex-col justify-end transition-opacity duration-300 opacity-0 w-full h-full">
        <div class="absolute inset-0 z-0" onclick="closeModal()"></div>
        <div id="modal-content" class="bg-white rounded-t-3xl max-w-4xl mx-auto w-full p-5 sm:p-8 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto transform transition-transform duration-300 translate-y-full relative z-10 flex flex-col pb-10">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-2 flex-shrink-0"></div>
            <div class="flex justify-between items-start mb-2 flex-shrink-0">
                <div class="flex-1 pr-4">
                    <h3 id="modal-title" class="font-black text-xl sm:text-2xl text-slate-800 leading-tight">編輯行程項目</h3>
                    <div id="modal-subtitle" class="text-amber-600 font-bold text-sm mt-1 hidden">🎭 10:30-11:30</div>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-3xl font-bold px-2 leading-none bg-slate-50 hover:bg-slate-100 rounded-full w-10 h-10 flex items-center justify-center transition-colors flex-shrink-0 border border-slate-100 shadow-sm">&times;</button>
            </div>
            
            <input type="hidden" id="modal-edit-index" value="-1">
            
            <div class="space-y-5 text-sm pb-2 overflow-y-auto hide-scrollbar w-full">
                <div class="grid grid-cols-[100px_1fr] sm:grid-cols-2 gap-4">
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-slate-500 font-bold mb-1.5 text-[11px] sm:text-xs tracking-wider flex items-center"><span class="mr-1">⏰</span> 時間</label>
                        <input type="text" id="modal-time" class="w-full border border-slate-200 rounded-2xl p-3 outline-none focus:border-blue-500 text-sm sm:text-base font-medium text-slate-700 bg-slate-50" placeholder="10:30-11:30">
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-slate-500 font-bold mb-1.5 text-[11px] sm:text-xs tracking-wider flex items-center"><span class="mr-1">💰</span> 預估金額 (TWD)</label>
                        <input type="number" id="modal-cost" class="w-full border border-slate-200 rounded-2xl p-3 outline-none focus:border-blue-500 text-sm sm:text-base font-bold text-slate-800 bg-slate-50" placeholder="0">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-500 font-bold mb-1.5 text-[11px] sm:text-xs tracking-wider flex items-center"><span class="mr-1">📍</span> 標題 / 名稱</label>
                    <input type="text" id="modal-item-title" class="w-full border border-slate-200 rounded-2xl p-3 outline-none focus:border-blue-500 text-sm sm:text-base font-bold text-slate-800 bg-slate-50" placeholder="巴黎歌劇院 Palais Garnier">
                </div>
                <div>
                    <label class="block text-slate-500 font-bold mb-1.5 text-[11px] sm:text-xs tracking-wider flex items-center"><span class="mr-1">📝</span> 備註</label>
                    <textarea id="modal-desc" class="w-full border border-slate-200 rounded-2xl p-3 outline-none h-20 focus:border-blue-500 text-sm text-slate-600 bg-slate-50 resize-none" placeholder="若進內部參觀請預留時間..."></textarea>
                </div>
                <div>
                    <label class="block text-amber-600 font-bold mb-1.5 text-[11px] sm:text-xs tracking-wider flex items-center"><span class="mr-1">🌟</span> 必看 / 必吃 / 小提醒</label>
                    <textarea id="modal-tips" class="w-full border border-amber-200 bg-amber-50 rounded-2xl p-3 outline-none h-20 focus:border-amber-500 text-sm text-amber-900 resize-none" placeholder="例如：必點可麗露..."></textarea>
                </div>
                <div>
                    <label class="block text-slate-500 font-bold mb-1.5 text-[11px] sm:text-xs tracking-wider flex items-center"><span class="mr-1">🗺️</span> 地圖關鍵字</label>
                    <input type="text" id="modal-map-key" class="w-full border border-slate-200 rounded-2xl p-3 outline-none focus:border-blue-500 text-sm sm:text-base text-slate-700 bg-slate-50 font-mono" placeholder="Palais Garnier Paris">
                </div>
                <div id="modal-move-day-container" class="pb-2">
                    <label class="block text-slate-500 font-bold mb-1.5 text-[11px] sm:text-xs tracking-wider flex items-center"><span class="mr-1">📅</span> 移動到哪一天</label>
                    <select id="modal-move-day" class="w-full border border-slate-200 rounded-2xl p-3.5 outline-none focus:border-blue-500 text-sm sm:text-base font-bold text-slate-700 bg-slate-50 cursor-pointer"></select>
                </div>
            </div>
            
            <div class="flex space-x-3 pt-4 border-t border-slate-100 flex-shrink-0 bg-white w-full">

        let appData = {
            activeTripId: "paris",

        let historyStack = [];
        let gasUrl = localStorage.getItem('gasUrl') || "";
        
        function initApp() {
            const savedData = localStorage.getItem('multiTripData');
            if (savedData) {
                try { appData = JSON.parse(savedData); } catch(e) {}
            }
            document.getElementById('gas-url').value = gasUrl;
            renderAll();
        }

        function getCurrentTrip() {
            if (!appData.trips[appData.activeTripId]) {
                appData.activeTripId = Object.keys(appData.trips)[0];
            }
            return appData.trips[appData.activeTripId];
        }

        function recordStateForUndo() {
            historyStack.push(JSON.stringify(appData));
            if (historyStack.length > 20) historyStack.shift();
        }

        function undo() {
            if (historyStack.length > 0) {
                appData = JSON.parse(historyStack.pop());
                saveLocal(); renderAll(); showNotification("↩️ 已復原");
            } else {
                showNotification("沒有可以復原的步驟了", "warning");
            }
        }

        function saveLocal() {
            localStorage.setItem('multiTripData', JSON.stringify(appData));
        }

        function renderAll() {
            renderDayTabs();
            renderTimeline();
            renderAccommodation();
            renderTickets();
            renderPacking();
            renderBudget();
        }

        function switchTab(tabId) {
            ['itinerary', 'accommodation', 'tickets', 'packing', 'budget'].forEach(id => {
                document.getElementById('view-' + id).classList.add('hidden');
                document.getElementById('tab-' + id).classList.remove('tab-active');
                document.getElementById('tab-' + id).classList.add('tab-inactive');
            });
            document.getElementById('view-' + tabId).classList.remove('hidden');
            document.getElementById('tab-' + tabId).classList.add('tab-active');
            document.getElementById('tab-' + tabId).classList.remove('tab-inactive');
        }

        function renderDayTabs() {
            const container = document.getElementById('day-tabs');
            container.innerHTML = '';
            const trip = getCurrentTrip();
            
            trip.days.forEach((day, index) => {
                const isActive = index === (trip.activeDayIndex || 0);
                const btn = document.createElement('button');
                btn.className = `min-w-[65px] py-2 px-2.5 rounded-2xl flex flex-col items-center justify-center transition-all flex-shrink-0 ${isActive ? 'bg-indigo-800 text-white shadow-md transform scale-105' : 'bg-white text-slate-500 border border-slate-100'}`;
                btn.innerHTML = `<span class="text-[11px] font-bold mb-1">${day.label}</span><span class="${isActive ? 'text-base font-black' : 'text-sm font-bold'}">${day.date}</span>`;
                btn.onclick = () => {
                    trip.activeDayIndex = index;
                    saveLocal(); renderDayTabs(); renderTimeline();
                };
                container.appendChild(btn);
            });
        }

        // --- Robust Long-Press Drag and Drop with Touch Scroll Lock ---
        let draggedIndex = null;
        let targetIndex = null;

        function setupLongPressDragAndDrop(el, index, currentDay) {
            let pressTimer = null;
            let isLongPressed = false;
            let startY = 0;

            const handleTouchStart = (e) => {
                if (e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) return;
                startY = e.touches[0].clientY;
                pressTimer = setTimeout(() => {
                    isLongPressed = true;
                    startDragging(el, index);
                    if (navigator.vibrate) navigator.vibrate(60);
                }, 400); // 0.4 seconds long press
            };

            const handleTouchMove = (e) => {
                if (!isLongPressed || draggedIndex === null) {
                    // If user moves finger before long press completes, cancel timer
                    if (Math.abs(e.touches[0].clientY - startY) > 10) {
                        clearTimeout(pressTimer);
                    }
                    return;
                }
                
                // Prevent scrolling during active drag
                e.preventDefault();
                
                const touchY = e.touches[0].clientY;
                const cards = document.querySelectorAll('.draggable-card');
                
                cards.forEach((card, idx) => {
                    const rect = card.getBoundingClientRect();
                    if (touchY >= rect.top && touchY <= rect.bottom) {
                        targetIndex = idx;
                        cards.forEach(c => c.classList.remove('drop-target-indicator'));
                        if (targetIndex !== draggedIndex) {
                            card.classList.add('drop-target-indicator');
                        }
                    }
                });
            };

            const handleTouchEnd = () => {
                clearTimeout(pressTimer);
                if (isLongPressed) {
                    stopDragging(el, currentDay);
                    isLongPressed = false;
                }
            };

            // Mouse equivalents for desktop testing
            const handleMouseDown = (e) => {
                if (e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) return;
                pressTimer = setTimeout(() => {
                    isLongPressed = true;
                    startDragging(el, index);
                }, 400);
            };

            const handleMouseMove = (e) => {
                if (!isLongPressed || draggedIndex === null) return;
                const mouseY = e.clientY;
                const cards = document.querySelectorAll('.draggable-card');
                
                cards.forEach((card, idx) => {
                    const rect = card.getBoundingClientRect();
                    if (mouseY >= rect.top && mouseY <= rect.bottom) {
                        targetIndex = idx;
                        cards.forEach(c => c.classList.remove('drop-target-indicator'));
                        if (targetIndex !== draggedIndex) {
                            card.classList.add('drop-target-indicator');
                        }
                    }
                });
            };

            const handleMouseUp = () => {
                clearTimeout(pressTimer);
                if (isLongPressed) {
                    stopDragging(el, currentDay);
                    isLongPressed = false;
                }
            };

            el.addEventListener('touchstart', handleTouchStart, {passive: true});
            window.addEventListener('touchmove', handleTouchMove, {passive: false});
            window.addEventListener('touchend', handleTouchEnd);

            el.addEventListener('mousedown', handleMouseDown);
            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);
        }

        function startDragging(el, index) {
            draggedIndex = index;
            targetIndex = index;
            el.classList.add('dragging-active');
            showNotification("✨ 已進入長按拖曳排序模式", "success");
        }

        function stopDragging(el, currentDay) {
            el.classList.remove('dragging-active');
            document.querySelectorAll('.draggable-card').forEach(c => c.classList.remove('drop-target-indicator'));

            if (draggedIndex !== null && targetIndex !== null && draggedIndex !== targetIndex) {
                recordStateForUndo();
                const items = currentDay.items;
                const movedItem = items.splice(draggedIndex, 1)[0];
                items.splice(targetIndex, 0, movedItem);
                saveLocal();
                renderTimeline();
                showNotification("🎯 行程順序已成功更新！");
            }
            draggedIndex = null;
            targetIndex = null;
        }

        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            const trip = getCurrentTrip();
            const currentDay = trip.days[trip.activeDayIndex || 0];
            
            if (!currentDay) return;

            document.getElementById('day-title').textContent = currentDay.subtitle || `Day ${(trip.activeDayIndex || 0) + 1}`;
            document.getElementById('day-subtitle').textContent = currentDay.desc || "";

            currentDay.items.forEach((item, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = "relative mb-2 w-full draggable-card";
                
                setupLongPressDragAndDrop(wrapper, index, currentDay);

                let htmlStr = `
                    <!-- Timeline vertical line and dot safely positioned to avoid overlap -->
                    <div class="absolute left-[-22px] top-4 bottom-[-16px] w-0.5 bg-slate-200 pointer-events-none"></div>
                    <div class="absolute left-[-26px] top-[1.25rem] w-3 h-3 rounded-full border-[2px] border-white bg-indigo-600 shadow-sm z-10 pointer-events-none"></div>
                    
                    <!-- Time display shifted left to prevent overlapping the gray line -->
                    <div class="absolute left-[-82px] top-[1.05rem] text-[12px] font-black text-amber-600 tracking-tighter text-right w-[54px]">${item.time || ''}</div>
                    
                    <!-- Main Card -->
                    <div class="bg-white border border-slate-100 p-4 sm:p-5 rounded-3xl shadow-sm hover:shadow-md transition-all relative flex flex-col gap-3 group overflow-hidden w-full select-none">
                        <div class="flex-1 w-full flex flex-col">
                            <div class="flex justify-between items-start mb-1 w-full">
                                <h4 class="font-black text-slate-800 text-[15px] sm:text-lg flex-1 pr-2 leading-tight break-words">${item.title}</h4>
                                <div class="flex items-center space-x-1 -mt-1 -mr-2 flex-shrink-0">
                                    <span class="text-slate-300 hover:text-indigo-600 text-sm px-1.5 cursor-grab active:cursor-grabbing" title="長按卡片即可拖曳排序">⋮⋮</span>
                                    <button onclick="editItem(${index})" class="text-slate-400 hover:text-blue-500 transition-colors p-2 rounded-lg" title="編輯">✏️</button>
                                    <button onclick="deleteItem(${index})" class="text-slate-400 hover:text-red-500 transition-colors p-2 rounded-lg" title="刪除">🗑️</button>
                                </div>
                            </div>
                `;

                if (item.desc) htmlStr += `<p class="text-[13px] sm:text-sm text-slate-500 mt-1 whitespace-pre-line leading-relaxed break-words">${item.desc}</p>`;
                if (item.tips) {
                    htmlStr += `
                    <div class="mt-3 bg-amber-50/70 rounded-2xl p-3 border border-amber-100 relative overflow-hidden w-full">
                        <p class="text-[12px] sm:text-sm text-amber-900 font-bold flex items-start leading-relaxed relative z-10">
                            <span class="mr-1.5">🌟</span>
                            <span class="break-words flex-1">${item.tips.replace(/\n/g, '<br>')}</span>
                        </p>
                    </div>`;
                }
                
                htmlStr += `
                            <div class="flex flex-wrap items-center gap-2 mt-3 pt-3 border-t border-slate-50 w-full">
                                <button onclick="openMapSearch('${(item.mapKey || item.title).replace(/'/g, "\\'")}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[11px] font-black px-3 py-1.5 rounded-xl flex items-center transition-colors shadow-sm whitespace-nowrap">
                                    📍 開啟地圖
                                </button>
                `;
                
                if (item.cost > 0) htmlStr += `<span class="bg-amber-50 text-amber-700 text-[11px] font-black px-3 py-1.5 rounded-xl flex items-center shadow-sm whitespace-nowrap">💰 NT$${item.cost}</span>`;
                
                htmlStr += `
                            </div>
                        </div>
                    </div>
                `;

                // Transit segment between items (夹缝交通显示)
                if (item.travelAfter) {
                    const t = item.travelAfter;
                    let icon = "🚶";
                    if(t.mode === 'car') icon = "🚗";
                    if(t.mode === 'train') icon = "🚆";

                    htmlStr += `
                        <div class="relative flex items-center py-2.5 pl-1">
                            <div class="flex items-center space-x-2 bg-slate-100 hover:bg-indigo-50 border border-slate-200 text-slate-600 hover:text-indigo-700 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm cursor-pointer select-none" onclick="editTravelSegment(${index})" title="點擊編輯交通時間">
                                <span>${icon}</span>
                                <span>${t.text}</span>
                                <span class="text-slate-400 text-[10px]">▶</span>
                            </div>
                        </div>
                    `;
                }
                
                wrapper.innerHTML = htmlStr;
                container.appendChild(wrapper);
            });
        }

        function showAddModal() { 
            document.getElementById('modal-title').textContent = '新增行程項目';

            openModal();

        function editItem(idx) {
            const trip = getCurrentTrip();
            const currentDayIndex = trip.activeDayIndex || 0;
            const currentDay = trip.days[currentDayIndex];
            const item = currentDay.items[idx];
            
            document.getElementById('modal-title').textContent = '編輯行程項目';
            const subtitle = document.getElementById('modal-subtitle');
            subtitle.innerHTML = `🎭 ${item.time || '時間未定'}`;
            subtitle.classList.remove('hidden');
            
            document.getElementById('modal-move-day-container').classList.remove('hidden');
            const select = document.getElementById('modal-move-day');
            select.innerHTML = '';
            trip.days.forEach((day, i) => {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `${day.date} (${day.label}) — ${i === currentDayIndex ? '目前所在天' : '移動至此'}`;
                if (i === currentDayIndex) option.selected = true;
                select.appendChild(option);
            });

            document.getElementById('modal-edit-index').value = idx;
            document.getElementById('modal-time').value = item.time || '';
            document.getElementById('modal-item-title').value = item.title || '';
            document.getElementById('modal-desc').value = item.desc || '';
            document.getElementById('modal-tips').value = item.tips || '';
            document.getElementById('modal-map-key').value = item.mapKey || '';
            document.getElementById('modal-cost').value = item.cost || 0;
            openModal();
        }

        function editTravelSegment(idx) {
            const currentDay = getCurrentTrip().days[getCurrentTrip().activeDayIndex || 0];
            const item = currentDay.items[idx];
            if (!item.travelAfter) item.travelAfter = { mode: "walk", text: "00時 15分" };
            const newText = prompt("修改交通時間 (例如: 00時 15分):", item.travelAfter.text);
            if (newText !== null) {
                recordStateForUndo();
                item.travelAfter.text = newText || "00時 10分";
                const modeChoice = prompt("選擇交通方式 (1: 步行 🚶, 2: 開車 🚗, 3: 大眾運輸 🚆):", "1");
                if (modeChoice === '2') item.travelAfter.mode = 'car';
                else if (modeChoice === '3') item.travelAfter.mode = 'train';
                else item.travelAfter.mode = 'walk';
                saveLocal();
                renderTimeline();
                showNotification("已更新交通時間！");
            }
        }

        function openModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            content.classList.remove('translate-y-full');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('translate-y-full');
            document.body.style.overflow = ''; 
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
        
        function saveModalItem() {
            recordStateForUndo();
            const editIndex = parseInt(document.getElementById('modal-edit-index').value);
            const trip = getCurrentTrip();
            const currentDayIndex = trip.activeDayIndex || 0;
            const currentDay = trip.days[currentDayIndex];
            
            const newItemData = {
                time: document.getElementById('modal-time').value || "隨時",
                title: document.getElementById('modal-item-title').value || "新項目",
                desc: document.getElementById('modal-desc').value || "",
                tips: document.getElementById('modal-tips').value || "",
                mapKey: document.getElementById('modal-map-key').value || "",
                cost: Number(document.getElementById('modal-cost').value || 0),
                travelAfter: editIndex > -1 && currentDay.items[editIndex] ? currentDay.items[editIndex].travelAfter : { mode: "walk", text: "00時 15分" }
            };

            if (editIndex > -1) {
                const targetDayIndex = parseInt(document.getElementById('modal-move-day').value);
                if (targetDayIndex !== currentDayIndex && targetDayIndex >= 0 && targetDayIndex < trip.days.length) {
                    currentDay.items.splice(editIndex, 1);
                    trip.days[targetDayIndex].items.push(newItemData);
                } else {
                    currentDay.items[editIndex] = newItemData;
                }
            } else {
                currentDay.items.push(newItemData);
            }
            
            saveLocal(); closeModal(); renderTimeline(); renderBudget();
            showNotification("行程已儲存！");
        }

        function deleteItem(idx) {
            if(confirm('確定要刪除這個行程項目嗎？')) {
                recordStateForUndo();
                getCurrentTrip().days[getCurrentTrip().activeDayIndex || 0].items.splice(idx, 1);
                saveLocal(); renderTimeline(); renderBudget();
            }
        }

        function renderAccommodation() {
            const trip = getCurrentTrip();
            document.getElementById('flight-out-date').textContent = trip.flight.outbound.date + " " + trip.flight.outbound.no;
            document.getElementById('flight-out-dept').textContent = trip.flight.outbound.dept;
            document.getElementById('flight-out-arr').textContent = trip.flight.outbound.arr;
            document.getElementById('flight-in-date').textContent = trip.flight.inbound.date + " " + trip.flight.inbound.no;
            document.getElementById('flight-in-dept').textContent = trip.flight.inbound.dept;
            document.getElementById('flight-in-arr').textContent = trip.flight.inbound.arr;

            const hotelList = document.getElementById('hotel-list');
            hotelList.innerHTML = '';
            trip.hotels.forEach((hotel, idx) => {
                hotelList.innerHTML += `
                    <div class="bg-amber-50/50 rounded-2xl p-4 border border-amber-100 relative">
                        <div class="font-black text-slate-800 text-base mb-1">${hotel.name}</div>
                        <div class="text-[13px] text-slate-500 mb-2">📅 ${hotel.date}</div>
                        <div class="text-[12px] text-slate-600 mb-3">${hotel.address}</div>
                        <button onclick="openMapSearch('${hotel.address.replace(/'/g, "\\'")}')" class="bg-white border border-amber-200 text-amber-700 text-[11px] font-bold px-3 py-1.5 rounded-xl shadow-sm">📍 開啟地圖</button>
                    </div>`;
            });
        }

        function editFlightInfo() {
            const trip = getCurrentTrip();
            const newOut = prompt("編輯去程 (格式：日期 航班號碼|起飛|抵達)", `${trip.flight.outbound.date} ${trip.flight.outbound.no}|${trip.flight.outbound.dept}|${trip.flight.outbound.arr}`);
            if(newOut) {
                let p = newOut.split('|');
                if(p.length===3) { let d = p[0].split(' '); trip.flight.outbound = { date: d[0], no: d.slice(1).join(' '), dept: p[1], arr: p[2] }; }
            }
            saveLocal(); renderAccommodation();
        }

        function addHotel() {
            const name = prompt("飯店名稱:");
            if(!name) return;
            const date = prompt("住宿日期 (例: 2/4~2/6 3晚):");
            const addr = prompt("飯店地址:");
            getCurrentTrip().hotels.push({name, date, address: addr});
            saveLocal(); renderAccommodation();
        }

        function renderTickets() {
            const container = document.getElementById('ticket-list');
            container.innerHTML = '';
            const tickets = getCurrentTrip().tickets || [];
            document.getElementById('ticket-count').textContent = `共 ${tickets.length} 項`;
            tickets.forEach((t, i) => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                        <div class="flex items-center space-x-3 flex-1 min-w-0 pr-2">
                            <input type="checkbox" ${t.done?'checked':''} onchange="toggleTicket(${i})" class="w-5 h-5 rounded text-blue-600">
                            <span class="${t.done?'line-through text-slate-400':'text-slate-700 font-bold'} text-sm truncate">${t.name}</span>
                        </div>
                        <span class="text-xs font-bold bg-amber-100 text-amber-700 px-2.5 py-1 rounded-lg">NT$ ${t.cost}</span>
                    </div>`;
            });
        }
        function toggleTicket(i) { getCurrentTrip().tickets[i].done = !getCurrentTrip().tickets[i].done; saveLocal(); renderTickets(); }
        function addTicket() {
            const inp = document.getElementById('new-ticket-input');
            if(inp.value.trim()){ getCurrentTrip().tickets.push({name: inp.value.trim(), cost: 0, done: false}); inp.value = ''; saveLocal(); renderTickets(); renderBudget(); }
        }

        function renderPacking() {
            const container = document.getElementById('packing-list');
            container.innerHTML = '';
            const packing = getCurrentTrip().packing || [];
            const doneCount = packing.filter(p=>p.done).length;
            document.getElementById('packing-progress').textContent = `${doneCount}/${packing.length} 完成`;
            document.getElementById('packing-progress-bar').style.width = `${packing.length ? (doneCount/packing.length)*100 : 0}%`;
            packing.forEach((p, i) => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <div class="flex items-center space-x-3 flex-1 min-w-0">
                            <input type="checkbox" ${p.done?'checked':''} onchange="togglePacking(${i})" class="w-5 h-5 rounded text-emerald-500">
                            <span class="${p.done?'line-through text-slate-400':'text-slate-700 font-bold'} text-sm truncate">${p.name}</span>
                        </div>
                    </div>`;
            });
        }
        function togglePacking(i) { getCurrentTrip().packing[i].done = !getCurrentTrip().packing[i].done; saveLocal(); renderPacking(); }
        function addPackingItem() {
            const inp = document.getElementById('new-packing-input');
            if(inp.value.trim()){ getCurrentTrip().packing.push({name: inp.value.trim(), done: false}); inp.value = ''; saveLocal(); renderPacking(); }
        }

        function setBaseCurrency(currency) {
            const trip = getCurrentTrip();
            trip.baseCurrency = currency;
            trip.exchangeRate = currency === 'EUR' ? 34.5 : 0.21;
            document.getElementById('exchange-rate').value = trip.exchangeRate;
            saveLocal(); renderBudget();
        }

        function calculateBudget() {
            getCurrentTrip().exchangeRate = Number(document.getElementById('exchange-rate').value) || 1;
            saveLocal(); renderBudget();
        }

        function renderBudget() {
            const trip = getCurrentTrip();
            document.getElementById('exchange-rate').value = trip.exchangeRate || 1;
            let itineraryTotal = 0;
            trip.days.forEach(day => day.items.forEach(item => itineraryTotal += (Number(item.cost) || 0)));
            let ticketTotal = 0;
            if(trip.tickets) trip.tickets.forEach(t => ticketTotal += (Number(t.cost) || 0));

            document.getElementById('budget-itinerary').textContent = `NT$ ${itineraryTotal.toLocaleString()}`;
            document.getElementById('budget-tickets').textContent = `NT$ ${ticketTotal.toLocaleString()}`;
            document.getElementById('total-budget').textContent = `NT$ ${(itineraryTotal + ticketTotal).toLocaleString()}`;
        }

        function openMapSearch(kw) {
            window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(kw)}`, '_blank');
        }

        function openDailyRouteMap() {
            const trip = getCurrentTrip();
            const currentDay = trip.days[trip.activeDayIndex || 0];
            if (!currentDay || !currentDay.items.length) { showNotification('今日尚無行程', 'error'); return; }
            const waypoints = currentDay.items.map(item => encodeURIComponent(item.mapKey || item.title));
            window.open(`https://www.google.com/maps/search/?api=1&query=${waypoints[0]}`, '_blank');
        }

        function showNotification(msg, type='success') {
            const div = document.createElement('div');
            div.className = `fixed bottom-24 left-1/2 transform -translate-x-1/2 px-5 py-2.5 rounded-full shadow-2xl text-white font-bold text-xs z-[200] transition-all duration-300 translate-y-10 opacity-0 ${type==='success'?'bg-emerald-600':'bg-red-600'}`;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => { div.classList.add('translate-y-10', 'opacity-0'); setTimeout(()=>div.remove(), 300); }, 2200);
        }

        function saveGasUrl() {
            gasUrl = document.getElementById('gas-url').value.trim();
            localStorage.setItem('gasUrl', gasUrl);
            showNotification('雲端網址已儲存！');
        }

        async function syncWithCloud() {
            if (!gasUrl) { showNotification('請先輸入並儲存 GAS 雲端網址！', 'error'); return; }
            const statusEl = document.getElementById('sync-status');
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-400 animate-ping mr-1.5"></span><span class="text-yellow-400">同步中...</span>`;
            try {
                await fetch(gasUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(appData) });
                setTimeout(() => {
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse mr-1.5"></span><span class="text-emerald-400 font-bold">🟢 已同步</span>`;
                    showNotification("雲端同步成功！");
                }, 800);
            } catch (error) {
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-1.5"></span><span class="text-red-400">失敗</span>`;
                showNotification("同步失敗", "error");
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>

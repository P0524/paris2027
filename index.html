<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊行程總管 - 多國多行程同步 Web App</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paris: { navy: '#0f172a', blue: '#1e3a8a', amber: '#d97706', accent: '#2563eb' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-header { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #172554 100%); }
        .toast-notify { transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 pointer-events-none toast-notify bg-slate-900/95 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-2xl border border-slate-700 flex items-center space-x-2">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">已成功同步！</span>
    </div>

    <header class="glass-header text-white sticky top-0 z-40 shadow-lg border-b border-white/10">
        <div class="max-w-4xl mx-auto px-4 pt-4 pb-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center space-x-2">
                    <span id="trip-country-tag" class="bg-amber-500 text-slate-950 font-black text-[11px] px-2 py-0.5 rounded tracking-wider shadow-sm">FR</span>
                    <div class="relative inline-block text-left">
                        <select id="trip-selector" onchange="switchTrip(this.value)" class="bg-slate-800/90 hover:bg-slate-800 text-white font-extrabold text-base sm:text-lg border border-white/20 rounded-xl px-3 py-1 pr-8 focus:outline-none focus:ring-2 focus:ring-amber-400 appearance-none cursor-pointer">
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-amber-300 pointer-events-none"></i>
                    </div>
                    <button onclick="openNewTripModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-2.5 py-1.5 rounded-lg shadow flex items-center space-x-1 transition-all">
                        <i class="fa-solid fa-plus"></i><span class="hidden sm:inline">新增/複製行程</span>
                    </button>
                    <button id="undo-btn" onclick="undoLastAction()" disabled class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold text-xs px-2.5 py-1.5 rounded-lg shadow flex items-center space-x-1.5 border border-slate-700 transition-all opacity-50 cursor-not-allowed">
                        <i class="fa-solid fa-rotate-left text-amber-400"></i>
                        <span>復原<span id="undo-count" class="hidden sm:inline text-[10px] text-amber-300 ml-0.5"></span></span>
                    </button>
                </div>

                <div id="sync-status" class="bg-slate-800/80 border border-slate-700 text-slate-300 text-xs px-3 py-1 rounded-full flex items-center space-x-1.5">
                    <span id="sync-dot" class="w-2 h-2 rounded-full bg-slate-400"></span>
                    <span id="sync-text" class="font-medium text-[11px] sm:text-xs">未綁定 Google 試算表</span>
                </div>
            </div>

            <div class="mt-3 pt-2.5 border-t border-white/10 space-y-2 text-xs">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex-1 flex items-center space-x-2 bg-slate-900/80 border border-white/10 rounded-lg px-2.5 py-1.5 min-w-[240px]">
                        <i class="fa-solid fa-table text-emerald-400 text-xs"></i>
                        <span class="text-slate-300 whitespace-nowrap text-[11px]">GAS 雲端網址:</span>
                        <input type="text" id="gas-url-input" placeholder="貼上 Google Apps Script 部署網址 (https://script.google.com/...)" class="w-full bg-slate-800 text-emerald-300 font-mono text-[11px] px-2 py-0.5 rounded border border-slate-700 focus:outline-none focus:border-emerald-400 truncate" />
                    </div>

                    <div class="flex items-center space-x-2">
                        <button onclick="saveGasUrl()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold px-3 py-1.5 rounded-lg border border-slate-600 transition-all text-xs">儲存網址</button>
                        <button onclick="syncWithGoogleSheets()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1.5 shadow-md border border-blue-400/30 transition-all text-xs">
                            <i class="fa-solid fa-rotate text-xs" id="sync-icon"></i><span>🔄 手動同步 (Sync)</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4">
        <!-- 導覽列標籤，改用可愛的 Emoji 標示 -->
        <nav class="flex space-x-1 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200/80 mb-4 overflow-x-auto no-scrollbar">
            <button onclick="switchTab('itinerary')" id="tab-btn-itinerary" class="tab-btn flex-1 min-w-[85px] py-2 px-2 text-xs sm:text-sm font-bold rounded-xl transition-all text-blue-900 bg-blue-50 shadow-sm border border-blue-200/50">
                <span class="mr-1 text-sm">📅</span> 每日行程
            </button>
            <button onclick="switchTab('overview')" id="tab-btn-overview" class="tab-btn flex-1 min-w-[85px] py-2 px-2 text-xs sm:text-sm font-bold text-slate-500 rounded-xl hover:text-slate-900 transition-all">
                <span class="mr-1 text-sm">✈️</span> 總覽住宿
            </button>
            <button onclick="switchTab('tickets')" id="tab-btn-tickets" class="tab-btn flex-1 min-w-[85px] py-2 px-2 text-xs sm:text-sm font-bold text-slate-500 rounded-xl hover:text-slate-900 transition-all">
                <span class="mr-1 text-sm">🎟️</span> 門票交通
            </button>
            <button onclick="switchTab('packing')" id="tab-btn-packing" class="tab-btn flex-1 min-w-[85px] py-2 px-2 text-xs sm:text-sm font-bold text-slate-500 rounded-xl hover:text-slate-900 transition-all">
                <span class="mr-1 text-sm">🎒</span> 行李清單
            </button>
            <button onclick="switchTab('budget')" id="tab-btn-budget" class="tab-btn flex-1 min-w-[85px] py-2 px-2 text-xs sm:text-sm font-bold text-slate-500 rounded-xl hover:text-slate-900 transition-all">
                <span class="mr-1 text-sm">💰</span> 預算
            </button>
        </nav>

        <section id="tab-itinerary" class="tab-content space-y-4">
            <div id="day-selector" class="flex space-x-2 overflow-x-auto pb-1 no-scrollbar"></div>
            
            <!-- 修改標題區塊，加入「開啟今日路線導航」按鈕 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center border border-slate-200/80 gap-3">
                <div>
                    <h2 id="day-header-title" class="text-base sm:text-lg font-bold text-slate-800">載入行程中...</h2>
                    <p id="day-header-desc" class="text-xs text-slate-500 mt-0.5"></p>
                </div>
                <button onclick="openDayNavigation()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs sm:text-sm px-4 py-2.5 rounded-xl flex items-center justify-center transition-all shadow-md">
                    <span class="mr-2">🧭</span>開啟今日路線導航
                </button>
            </div>

            <!-- 行程時間軸容器 -->
            <div id="timeline-container" class="space-y-3 relative before:absolute before:inset-0 before:left-[45px] before:w-[2px] before:bg-slate-200"></div>
            
            <button onclick="showAddModal()" class="w-full py-3 bg-white border-2 border-dashed border-slate-300 text-slate-600 font-bold text-xs sm:text-sm rounded-2xl hover:border-blue-500 hover:text-blue-600 transition-all flex items-center justify-center space-x-2 shadow-sm">
                <i class="fa-solid fa-plus text-blue-600"></i><span>新增此日行程項目</span>
            </button>
        </section>

        <section id="tab-overview" class="tab-content hidden space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                    <div class="flex items-center space-x-2 text-slate-900 font-bold border-b pb-2.5">
                        <i class="fa-solid fa-plane-departure text-amber-500 text-lg"></i><span>航班 / 交通資訊</span>
                    </div>
                    <div id="overview-flight-details" class="text-xs space-y-2.5 text-slate-600"></div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                    <div class="flex items-center space-x-2 text-slate-900 font-bold border-b pb-2.5">
                        <i class="fa-solid fa-hotel text-amber-500 text-lg"></i><span>住宿飯店資訊</span>
                    </div>
                    <div id="overview-hotel-details" class="text-xs space-y-2 text-slate-600"></div>
                </div>
            </div>
        </section>

        <section id="tab-tickets" class="tab-content hidden space-y-4">
            <div id="tickets-container" class="space-y-4"></div>
        </section>

        <section id="tab-packing" class="tab-content hidden space-y-4">
            <div id="packing-container" class="space-y-4"></div>
        </section>

        <section id="tab-budget" class="tab-content hidden space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm text-center">

                    <p id="top-total-budget" class="text-xl font-black text-slate-900 mt-1">NT$300,000</p>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm text-center">
                    <p class="text-xs text-slate-500 mb-1">目前預估花費</p>
                    <p id="top-estimated-cost" class="text-xl font-black text-blue-900 mt-1">NT$0</p>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-2">
                <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                    <div id="budget-progress-bar" class="bg-blue-600 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                <div class="flex items-center space-x-2 text-slate-900 font-bold border-b pb-2.5">
                    <span class="text-rose-500">■</span><span>分類花費 (已含機票)</span>
                </div>
                <div id="category-breakdown-list" class="divide-y divide-slate-100 text-xs"></div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                <div class="flex items-center space-x-2 text-slate-900 font-bold border-b pb-2.5">
                    <i class="fa-solid fa-pen-to-square text-slate-600"></i><span>手動填寫的費用</span>
                </div>
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block text-slate-600 font-semibold mb-1">✈️ 機票費用 (2人總額，TWD)</label>
                        <input type="number" id="manual-flight-input" onchange="updateManualExpense('flight', this.value)" class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-800 text-sm" placeholder="100000">
                    </div>
                    <div>
                        <label class="block text-slate-600 font-semibold mb-1">🛍️ 購物費用 (2人總額，TWD)</label>

                    </div>
                    <div>
                        <label class="block text-slate-600 font-semibold mb-1">🏨 住宿費用 (2人總額，TWD)</label>
                        <input type="number" id="manual-hotel-input" onchange="updateManualExpense('hotel', this.value)" class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-800 text-sm" placeholder="0">
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                <div class="flex items-center space-x-2 text-slate-900 font-bold border-b pb-2.5">
                    <i class="fa-solid fa-pen text-amber-500"></i><span>調整每人總預算</span>
                </div>
                <div class="flex flex-wrap items-center gap-2">

                    <button onclick="updateTripBudget(document.getElementById('trip-budget-input').value)" class="bg-blue-900 hover:bg-blue-800 text-white font-bold text-xs sm:text-sm px-5 py-3 rounded-xl shadow transition-all">更新每人總預算</button>
                </div>
            </div>
        </section>
    </main>

    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modal-title" class="font-bold text-base text-slate-800">新增行程</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <div class="space-y-3 text-xs">
                <div><label class="block text-slate-600 font-semibold mb-1">時間</label><input type="text" id="modal-time" class="w-full border rounded-lg p-2.5 outline-none" placeholder="09:00"></div>
                <div><label class="block text-slate-600 font-semibold mb-1">標題/地點名稱</label><input type="text" id="modal-item-title" class="w-full border rounded-lg p-2.5 outline-none" placeholder="景點名稱"></div>
                <div><label class="block text-slate-600 font-semibold mb-1">細節/備註</label><textarea id="modal-desc" class="w-full border rounded-lg p-2.5 outline-none h-20" placeholder="備註說明"></textarea></div>
                <div><label class="block text-slate-600 font-semibold mb-1">估算花費 (NT$)</label><input type="number" id="modal-cost" class="w-full border rounded-lg p-2.5 outline-none" placeholder="0"></div>

            <div class="flex space-x-2 pt-2">
                <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200">取消</button>
                <button onclick="saveModalItem()" class="flex-1 py-2.5 bg-blue-900 text-white font-bold rounded-xl hover:bg-blue-800 shadow">儲存</button>
            </div>
        </div>
    </div>

                    { category: "交通類", title: "市區交通費用 (地鐵 / 計程車)", status: "尚未購買", cost: 3000, note: "已合併計算" }
                ],
                packing: [
                    { 
                        category: "行前準備 / 行李清單", 
                        items: [
                            { name: "護照與影本 (效期6個月以上)", checked: false },
                            { name: "機票、飯店訂單截圖/紙本", checked: false },
                            { name: "歐元現金＋信用卡（雙卡分開放）", checked: false },
                            { name: "旅平險保單", checked: false },
                            { name: "歐洲上網 eSIM", checked: false },
                            { name: "手機充電線、歐規轉接頭、行動電源", checked: false },
                            { name: "保暖外套、圍巾、手套、毛帽", checked: false },
                            { name: "防水鞋", checked: false },
                            { name: "常備藥品", checked: false },
                            { name: "環保購物袋（法國超市多需自備）", checked: false },
                            { name: "申根保險單", checked: false }
                        ] 
                    }
                ]
            }
        };

        let masterData = {
            activeTripId: "paris_2027",
            trips: {
                "paris_2027": {
                    id: "paris_2027", name: "巴黎 Bonjour 2027", country: "FR", currency: "EUR",
                    budget: 150000, manualFlight: 100000, manualShopping: 20000, manualHotel: 0,
                    activeDayIndex: 0, flight: presetTemplates.paris.flight, hotel: presetTemplates.paris.hotel,
                    days: presetTemplates.paris.days, tickets: presetTemplates.paris.tickets, packing: presetTemplates.paris.packing
                }
            }
        };

        let gasUrl = localStorage.getItem('paris_gas_url') || "";
        let undoStack = [];

        window.onload = function() {
            initLocalStorage();
            if (gasUrl) {
                document.getElementById('gas-url-input').value = gasUrl;
                syncWithGoogleSheets(true);
            }
            renderAll();
        };

        function recordStateForUndo() {
            if (undoStack.length >= 20) undoStack.shift();
            undoStack.push(JSON.stringify(masterData));
            const undoBtn = document.getElementById('undo-btn');
            undoBtn.disabled = false;
            undoBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('undo-count').textContent = `(${undoStack.length})`;
        }

        function undoLastAction() {
            if (undoStack.length === 0) return;
            masterData = JSON.parse(undoStack.pop());
            saveLocal(); renderAll(); showToast("↩️ 已成功復原上一步！");
        }

        function getCurrentTrip() { return masterData.trips[masterData.activeTripId] || Object.values(masterData.trips)[0]; }

        function ensureFullDataIntegrity() {
            Object.values(masterData.trips).forEach(trip => {
                if (trip.id === 'paris_2027') {
                    if (!trip.days || trip.days.length < 7) trip.days = JSON.parse(JSON.stringify(presetTemplates.paris.days));
                    if (!trip.tickets || trip.tickets.length < 9) trip.tickets = JSON.parse(JSON.stringify(presetTemplates.paris.tickets));
                    if (!trip.packing || !trip.packing[0] || trip.packing[0].items.length < 11) trip.packing = JSON.parse(JSON.stringify(presetTemplates.paris.packing));
                }
            });
        }

        function initLocalStorage() {
            const local = localStorage.getItem('multi_travel_app_data');
            if (local) { try { masterData = JSON.parse(local); ensureFullDataIntegrity(); } catch(e) {} }
            else { ensureFullDataIntegrity(); }
            saveLocal();
        }

        function saveLocal() {
            localStorage.setItem('multi_travel_app_data', JSON.stringify(masterData));
            pushDataToGoogleSheets();
        }

        async function syncWithGoogleSheets(isSilent = false) {
            if (!gasUrl) return;
            const syncIcon = document.getElementById('sync-icon');
            if (syncIcon) syncIcon.classList.add('animate-spin');

            try {
                const response = await fetch(gasUrl);
                if (response.ok) {
                    const fetchedData = await response.json();
                    if (fetchedData && fetchedData.trips) {
                        masterData = fetchedData; ensureFullDataIntegrity();
                        localStorage.setItem('multi_travel_app_data', JSON.stringify(masterData));
                        renderAll(); updateSyncBadge(true, "🟢 雲端已同步");
                        if (!isSilent) showToast("成功同步最新資料！");
                    }
                }
            } catch (err) { updateSyncBadge(false, "🔴 連線失敗"); } 
            finally { if (syncIcon) syncIcon.classList.remove('animate-spin'); }
        }

        async function pushDataToGoogleSheets() {
            if (!gasUrl) return;
            try {
                await fetch(gasUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(masterData) });
                updateSyncBadge(true, "🟢 雲端已同步");
            } catch (err) {}
        }

        function saveGasUrl() {
            gasUrl = document.getElementById('gas-url-input').value.trim();
            localStorage.setItem('paris_gas_url', gasUrl); syncWithGoogleSheets();
        }

        function updateSyncBadge(isOk, text) {
            document.getElementById('sync-text').textContent = text;
            document.getElementById('sync-dot').className = `w-2 h-2 rounded-full ${isOk ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500'}`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('-translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => toast.classList.add('-translate-y-20', 'opacity-0', 'pointer-events-none'), 2500);
        }

        function renderAll() {
            renderTripSelector(); renderDaySelector(); renderTimeline();
            renderOverview(); renderTickets(); renderPacking(); renderBudget();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-50', 'text-blue-900', 'shadow-sm', 'border', 'border-blue-200/50');
                btn.classList.add('text-slate-500');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-btn-${tabId}`);
            activeBtn.classList.add('bg-blue-50', 'text-blue-900', 'shadow-sm', 'border', 'border-blue-200/50');
            activeBtn.classList.remove('text-slate-500');
        }

        function switchTrip(tripId) { recordStateForUndo(); masterData.activeTripId = tripId; saveLocal(); renderAll(); }

        function renderTripSelector() {
            const select = document.getElementById('trip-selector');
            select.innerHTML = '';
            Object.values(masterData.trips).forEach(trip => {
                const opt = document.createElement('option');
                opt.value = trip.id; opt.textContent = trip.name;
                if (trip.id === masterData.activeTripId) opt.selected = true;
                select.appendChild(opt);
            });
            document.getElementById('trip-country-tag').textContent = getCurrentTrip().country || "TRIP";
        }

        function renderDaySelector() {
            const trip = getCurrentTrip();
            const container = document.getElementById('day-selector');
            container.innerHTML = '';
            trip.days.forEach((day, index) => {
                const active = index === trip.activeDayIndex;
                const btn = document.createElement('button');
                btn.className = `px-3 py-2 rounded-xl text-center min-w-[68px] ${active ? 'bg-blue-900 text-white font-bold' : 'bg-white text-slate-600 border'}`;
                btn.onclick = () => { trip.activeDayIndex = index; saveLocal(); renderDaySelector(); renderTimeline(); };
                btn.innerHTML = `<div class="text-[10px]">${day.week}</div><div class="text-sm font-bold">${day.date}</div>`;
                container.appendChild(btn);
            });
        }
        
        // 開啟地圖搜尋單一景點
        function openMapSearch(title) {
            const cleanTitle = title.replace(/[^\w\s\u4e00-\u9fa5]/gi, '').trim();
            const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanTitle + ' Paris')}`;
            window.open(url, '_blank');
        }

        // 開啟當日路線導航
        function openDayNavigation() {
            const trip = getCurrentTrip();
            const currentDay = trip.days[trip.activeDayIndex];
            if(!currentDay || !currentDay.items || currentDay.items.length === 0) {
                showToast("當日無行程，無法導航！"); return;
            }
            
            // 提取地點名稱並過濾 Emoji
            const locations = currentDay.items.map(item => item.title.replace(/[^\w\s\u4e00-\u9fa5]/gi, '').trim() + ' Paris').filter(loc => loc.length > 5);
            
            if (locations.length === 0) return;

            let url = "https://www.google.com/maps/dir/?api=1";
            
            if (locations.length === 1) {
                url += `&destination=${encodeURIComponent(locations[0])}`;
            } else {
                url += `&origin=${encodeURIComponent(locations[0])}&destination=${encodeURIComponent(locations[locations.length - 1])}`;
                if (locations.length > 2) {
                    const waypoints = locations.slice(1, -1).map(loc => encodeURIComponent(loc)).join('|');
                    url += `&waypoints=${waypoints}`;
                }
            }
            window.open(url, '_blank');
        }

        function renderTimeline() {
            const trip = getCurrentTrip();
            const currentDay = trip.days[trip.activeDayIndex];
            if(!currentDay) return;
            document.getElementById('day-header-title').textContent = currentDay.title;
            
            // 動態產生今日路線文字
            const routeText = currentDay.items.map(i => i.title.replace(/[^\w\s\u4e00-\u9fa5]/gi, '').trim()).filter(t=>t).join(" ➔ ");
            document.getElementById('day-header-desc').textContent = routeText || "無路線資訊";

            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            currentDay.items.forEach((item, idx) => {
                container.innerHTML += `
                    <div class="relative pl-12 pb-2">
                        <!-- 時間區塊：固定在左側 -->
                        <div class="absolute left-0 top-3 text-amber-600 font-black text-sm text-right w-10 leading-none">${item.time}</div>
                        <!-- 時間軸的圓點 -->
                        <div class="absolute left-[41.5px] top-4 w-2 h-2 rounded-full bg-slate-300 border border-white shadow-sm z-10"></div>
                        
                        <!-- 內容卡片 -->
                        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 ml-3 hover:border-blue-200 transition-colors">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-slate-800 text-base">${item.title}</h4>
                                <button onclick="deleteItem(${idx})" class="text-xs text-slate-300 hover:text-rose-500 transition-colors ml-2"><i class="fa-solid fa-trash"></i></button>
                            </div>
                            
                            ${item.desc ? `<p class="text-sm text-slate-500 mb-3 whitespace-pre-line">${item.desc}</p>` : ''}
                            
                            <!-- 底部操作列 (開啟地圖 & 費用) -->
                            <div class="flex items-center space-x-3 mt-3 pt-3 border-t border-slate-50">
                                <button onclick="openMapSearch('${item.title}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[11px] font-bold px-3 py-1.5 rounded-lg flex items-center transition-colors">
                                    <span class="text-rose-500 mr-1.5 text-sm">📍</span> 開啟地圖
                                </button>
                                <div class="flex items-center text-slate-600 text-xs font-semibold">
                                    <span class="text-amber-500 mr-1 text-sm">💰</span> NT$${item.cost || 0}
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function renderOverview() {
            const trip = getCurrentTrip();
            document.getElementById('overview-flight-details').innerHTML = `<div class="bg-slate-50 p-3 rounded-xl border">${trip.flight}</div>`;
            document.getElementById('overview-hotel-details').innerHTML = `<div class="bg-slate-50 p-3 rounded-xl border font-bold">${trip.hotel}</div>`;
        }

        function renderTickets() {
            const trip = getCurrentTrip();
            const container = document.getElementById('tickets-container');
            let attrTotal = 0, transTotal = 0; let attrHtml = '', transHtml = '';
            trip.tickets.forEach((t, i) => {
                if (t.category === "交通類") { transTotal += Number(t.cost || 0); transHtml += generateTicketCard(t, i); } 
                else { attrTotal += Number(t.cost || 0); attrHtml += generateTicketCard(t, i); }
            });
            container.innerHTML = `
                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                    <div class="flex justify-between items-center border-b pb-2"><span class="font-bold text-xs text-slate-700">🎟️ 景點門票類</span><span class="font-black text-blue-900 text-sm">NT$${attrTotal.toLocaleString()}</span></div>
                    <div class="space-y-3">${attrHtml}</div>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                    <div class="flex justify-between items-center border-b pb-2"><span class="font-bold text-xs text-slate-700">🚌 交通類</span><span class="font-black text-blue-900 text-sm">NT$${transTotal.toLocaleString()}</span></div>
                    <div class="space-y-3">${transHtml}</div>
                </div>
                <button onclick="addTicket()" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-xl transition-colors">新增票券項目</button>
            `;
        }

        function generateTicketCard(t, i) {
            const isBought = t.status === "已購買";
            return `
                <div class="p-3 bg-slate-50 rounded-xl border space-y-2">
                    <div class="flex flex-wrap justify-between gap-2">
                        <div class="flex items-center space-x-2">
                            <select onchange="updateTicket(${i}, 'status', this.value)" class="text-xs px-2 py-1 border rounded-lg ${isBought ? 'bg-emerald-600 text-white' : 'bg-slate-200'}">
                                <option ${t.status==="已購買"?'selected':''}>已購買</option><option ${t.status!=="已購買"?'selected':''}>尚未購買</option>
                            </select>
                            <input type="text" value="${t.title}" onchange="updateTicket(${i}, 'title', this.value)" class="font-bold text-sm bg-transparent border-b outline-none w-32 sm:w-auto">
                        </div>
                        <div class="flex items-center space-x-2">
                            <input type="number" value="${t.cost}" onchange="updateTicket(${i}, 'cost', this.value)" class="w-20 text-xs font-bold border rounded px-1 py-0.5">
                            <button onclick="deleteTicket(${i})" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <input type="text" value="${t.note||''}" placeholder="備註..." onchange="updateTicket(${i}, 'note', this.value)" class="w-full text-xs text-slate-500 bg-transparent outline-none">
                </div>`;
        }

        function updateTicket(i, field, val) { recordStateForUndo(); getCurrentTrip().tickets[i][field] = val; saveLocal(); renderTickets(); renderBudget(); }
        function deleteTicket(i) { recordStateForUndo(); getCurrentTrip().tickets.splice(i, 1); saveLocal(); renderTickets(); renderBudget(); }
        function addTicket() { recordStateForUndo(); getCurrentTrip().tickets.push({ category: "景點門票", title: "新票券", status: "尚未購買", cost: 0, note: "" }); saveLocal(); renderTickets(); }

        function renderPacking() {
            const trip = getCurrentTrip();
            const container = document.getElementById('packing-container');
            let total = 0, checked = 0, html = '';
            trip.packing[0].items.forEach((item, i) => {
                total++; if(item.checked) checked++;
                html += `
                    <div class="flex items-center justify-between p-2 border-b border-slate-100 last:border-0">
                        <label class="flex items-center space-x-3 cursor-pointer flex-1">
                            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="togglePack(${i})" class="w-4 h-4 text-blue-900 rounded">
                            <span class="text-sm ${item.checked ? 'line-through text-slate-400' : 'text-slate-700 font-medium'}">${item.name}</span>
                        </label>
                        <button onclick="deletePack(${i})" class="text-slate-300 hover:text-rose-500"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>`;
            });
            const pct = total === 0 ? 0 : Math.round((checked/total)*100);
            container.innerHTML = `
                <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h2 class="font-bold text-slate-800">🎒 行李清單</h2>
                        <span class="text-xs font-bold text-blue-900 bg-blue-50 px-3 py-1 rounded-full">${checked}/${total} 完成</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full transition-all" style="width: ${pct}%"></div></div>
                    <div class="space-y-1">${html}</div>
                    <div class="flex space-x-2 pt-2">
                        <input type="text" id="new-pack" placeholder="新增項目..." class="flex-1 border rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-500">
                        <button onclick="addPack()" class="bg-blue-900 hover:bg-blue-800 text-white font-bold text-sm px-4 py-2 rounded-xl transition-colors">新增</button>
                    </div>
                </div>`;
        }

        function togglePack(i) { recordStateForUndo(); getCurrentTrip().packing[0].items[i].checked = !getCurrentTrip().packing[0].items[i].checked; saveLocal(); renderPacking(); }
        function deletePack(i) { recordStateForUndo(); getCurrentTrip().packing[0].items.splice(i, 1); saveLocal(); renderPacking(); }
        function addPack() {
            const name = document.getElementById('new-pack').value.trim();
            if(!name) return;
            recordStateForUndo(); getCurrentTrip().packing[0].items.push({name, checked: false}); saveLocal(); renderPacking();
        }

        function renderBudget() {
            const trip = getCurrentTrip();
            document.getElementById('trip-budget-input').value = trip.budget;
            document.getElementById('manual-flight-input').value = trip.manualFlight;
            document.getElementById('manual-shopping-input').value = trip.manualShopping;
            document.getElementById('manual-hotel-input').value = trip.manualHotel;

            let fTotal = Number(trip.manualFlight || 0), sTotal = Number(trip.manualShopping || 0), hTotal = Number(trip.manualHotel || 0);
            let aTotal = 0, tTotal = 0;
            trip.tickets.forEach(t => t.category === "交通類" ? tTotal += Number(t.cost||0) : aTotal += Number(t.cost||0));
            let dTotal = 0; trip.days.forEach(d => d.items.forEach(i => dTotal += Number(i.cost||0))); 
            let grandTotal = fTotal + sTotal + hTotal + aTotal + tTotal + dTotal;

            document.getElementById('top-total-budget').textContent = `NT$${trip.budget.toLocaleString()}`;
            document.getElementById('top-estimated-cost').textContent = `NT$${grandTotal.toLocaleString()}`;

            const pct = Math.min(Math.round((grandTotal / trip.budget) * 100), 100);
            const bar = document.getElementById('budget-progress-bar');
            bar.style.width = `${pct}%`;
            bar.className = `h-full transition-all duration-300 ${pct > 100 ? 'bg-rose-500' : pct > 80 ? 'bg-amber-500' : 'bg-blue-600'}`;

            document.getElementById('category-breakdown-list').innerHTML = `
                <div class="py-2.5 flex justify-between"><span class="text-slate-700">機票</span><span class="font-bold">NT$${fTotal.toLocaleString()}</span></div>
                <div class="py-2.5 flex justify-between"><span class="text-slate-700">購物</span><span class="font-bold">NT$${sTotal.toLocaleString()}</span></div>
                <div class="py-2.5 flex justify-between"><span class="text-slate-700">景點門票</span><span class="font-bold">NT$${aTotal.toLocaleString()}</span></div>
                <div class="py-2.5 flex justify-between"><span class="text-slate-700">行程/餐飲花費</span><span class="font-bold">NT$${dTotal.toLocaleString()}</span></div>
                <div class="py-2.5 flex justify-between"><span class="text-slate-700">交通</span><span class="font-bold">NT$${tTotal.toLocaleString()}</span></div>
                <div class="py-2.5 flex justify-between"><span class="text-slate-700">住宿</span><span class="font-bold">NT$${hTotal.toLocaleString()}</span></div>
            `;
        }

        function updateManualExpense(type, val) {
            recordStateForUndo();
            if(type==='flight') getCurrentTrip().manualFlight = Number(val);
            if(type==='shopping') getCurrentTrip().manualShopping = Number(val);
            if(type==='hotel') getCurrentTrip().manualHotel = Number(val);
            saveLocal(); renderBudget();
        }

        function updateTripBudget(val) { recordStateForUndo(); getCurrentTrip().budget = Number(val); saveLocal(); renderBudget(); showToast("總預算已更新！"); }

        function showAddModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function saveModalItem() {
            recordStateForUndo();
            getCurrentTrip().days[getCurrentTrip().activeDayIndex].items.push({
                time: document.getElementById('modal-time').value || "隨時",
                title: document.getElementById('modal-item-title').value || "新項目",
                desc: document.getElementById('modal-desc').value || "",
                cost: Number(document.getElementById('modal-cost').value || 0)
            });
            saveLocal(); closeModal(); renderTimeline(); renderBudget();
        }
        function deleteItem(idx) { recordStateForUndo(); getCurrentTrip().days[getCurrentTrip().activeDayIndex].items.splice(idx, 1); saveLocal(); renderTimeline(); renderBudget(); }
    </script>
</body>
</html>
